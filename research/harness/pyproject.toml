[project]
name = "fewshot-intent"
version = "0.1.0"
description = "Few-shot spoken-intent matching harness (frozen speech encoder + prototypes, no transcription)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "soundfile>=0.12",
    "soxr>=0.5",
    "torch>=2.6",
    "transformers>=4.48,<5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
]

[project.scripts]
fewshot = "fewshot_intent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fewshot_intent"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
