<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AMMA Maternal Check</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Nunito+Sans:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            paper: '#F6EDE4',
            cocoa: '#3A2418',
            'cocoa-muted': '#7A6558',
            clay: '#C4513A',
            'clay-on': '#FFF8F3',
            sage: '#2F6F56',
            honey: '#E8A838',
            'urgent-rose': '#9B2331'
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "Noto Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "Noto Sans", "sans-serif"],
            body: ["Public Sans", "Noto Sans", "sans-serif"],
            label: ["Nunito Sans", "Noto Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    .touch-target {
      min-height: 56px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F6EDE4] text-[#3A2418] font-body min-h-screen flex flex-col justify-between antialiased selection:bg-[#E8A838]/20">
<div class="w-full max-w-[28rem] mx-auto min-h-screen flex flex-col px-5 pt-3 pb-8 justify-between">
<!-- Top & Main Content Area -->
<div class="flex flex-col gap-6">
<!-- Header Row (Shared TopAppBar Anchor faithfully styled) -->
<header class="flex justify-between items-center w-full max-w-md mx-auto px-1 pt-2 pb-1 bg-transparent">
<!-- Brand Logo & Cradle Glyph -->
<div class="font-headline font-bold text-xl text-[#3A2418] tracking-tight flex items-center gap-2">
<div class="w-10 h-10 rounded-full bg-[#C4513A]/10 flex items-center justify-center text-[#C4513A]">
<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">cruelty_free</span>
</div>
<span class="font-headline font-bold text-2xl tracking-tight text-[#3A2418]">AMMA</span>
</div>
<!-- Trailing Language Selector -->
<button aria-label="Language selection" class="touch-target inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-white shadow-sm border border-[#3A2418]/10 text-sm font-label font-bold text-[#3A2418] active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[18px] text-[#C4513A]" style="font-variation-settings: 'FILL' 0;">language</span>
<span>हिन्दी / EN</span>
<span class="material-symbols-outlined text-[18px] text-[#7A6558]">expand_more</span>
</button>
</header>
<!-- Greeting Block -->
<section class="mt-2 space-y-1.5">
<h1 class="font-headline font-bold text-[26px] leading-tight text-[#3A2418]">
          Who are we checking on today?
        </h1>
<p class="font-body text-base text-[#7A6558] font-normal">
          A weekly check, in her own words.
        </p>
</section>
<!-- Honey Note Card (Gentle Notice) -->
<aside aria-label="Draft Notice" class="w-full bg-[#E8A838]/15 border border-[#E8A838]/40 rounded-xl p-3.5 flex items-start gap-3">
<div class="w-6 h-6 rounded-full bg-[#E8A838]/30 flex-shrink-0 flex items-center justify-center text-[#3A2418] mt-0.5">
<span class="material-symbols-outlined text-[17px]">info</span>
</div>
<p class="font-label text-sm text-[#3A2418] leading-snug">
          Draft wording, not yet checked by a speaker or a clinician.
        </p>
</aside>
<!-- Person Cards Stack (Large, accessible, thumb-friendly) -->
<main aria-label="Profiles to check" class="space-y-4 pt-1">
<!-- Card 1: Sunita -->
<button class="w-full text-left bg-white rounded-xl p-5 shadow-[0_4px_16px_rgba(58,36,24,0.06)] border border-[#3A2418]/5 flex items-center justify-between gap-4 active:scale-[0.99] transition-transform duration-150" type="button">
<div class="flex items-center gap-4 min-w-0">
<!-- Warm Maternal Badge/Icon -->
<div class="w-14 h-14 rounded-full bg-[#F6EDE4] border border-[#C4513A]/20 flex-shrink-0 flex items-center justify-center text-[#C4513A]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">pregnant_woman</span>
</div>
<!-- Details -->
<div class="space-y-1 min-w-0">
<div class="flex items-center gap-2">
<span class="font-headline font-bold text-xl text-[#3A2418] truncate">Sunita</span>
<span aria-label="Private record" class="inline-flex items-center text-[#7A6558] p-0.5" title="Protected check">
<span class="material-symbols-outlined text-base">lock</span>
</span>
</div>
<p class="font-label text-sm text-[#7A6558] leading-tight">
                Pregnant · 28 weeks · last check 3 days ago
              </p>
<div class="pt-1">
<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-label font-semibold bg-[#2F6F56]/10 text-[#2F6F56]">
<span class="material-symbols-outlined text-[13px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                  Up to date
                </span>
</div>
</div>
</div>
<!-- Chevron -->
<div class="flex-shrink-0 text-[#7A6558]/70">
<span class="material-symbols-outlined text-2xl">arrow_forward_ios</span>
</div>
</button>
<!-- Card 2: Meera -->
<button class="w-full text-left bg-white rounded-xl p-5 shadow-[0_4px_16px_rgba(58,36,24,0.06)] border border-[#3A2418]/5 flex items-center justify-between gap-4 active:scale-[0.99] transition-transform duration-150" type="button">
<div class="flex items-center gap-4 min-w-0">
<!-- New Mother Stage Badge -->
<div class="w-14 h-14 rounded-full bg-[#F6EDE4] border border-[#E8A838]/30 flex-shrink-0 flex items-center justify-center text-[#3A2418]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">child_care</span>
</div>
<!-- Details -->
<div class="space-y-1 min-w-0">
<div class="flex items-center gap-2">
<span class="font-headline font-bold text-xl text-[#3A2418] truncate">Meera</span>
</div>
<p class="font-label text-sm text-[#7A6558] leading-tight">
                Baby is 2 weeks old · no check yet
              </p>
<div class="pt-1">
<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-label font-semibold bg-[#E8A838]/20 text-[#3A2418]">
<span class="material-symbols-outlined text-[13px]">schedule</span>
                  Check due
                </span>
</div>
</div>
</div>
<!-- Chevron -->
<div class="flex-shrink-0 text-[#7A6558]/70">
<span class="material-symbols-outlined text-2xl">arrow_forward_ios</span>
</div>
</button>
</main>
</div>
<!-- Bottom Thumb-Zone Action Area -->
<footer class="pt-8 pb-2">
<button class="touch-target w-full rounded-xl bg-white border-2 border-dashed border-[#7A6558]/40 hover:border-[#C4513A] text-[#3A2418] font-headline font-semibold text-base flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-all duration-150" type="button">
<span class="material-symbols-outlined text-xl text-[#C4513A]">add_circle</span>
<span>Add a person</span>
</button>
<!-- Low-literacy voice helper whisper note -->
<div class="mt-3 flex items-center justify-center gap-1.5 text-xs text-[#7A6558] font-label">
<span class="material-symbols-outlined text-sm">volume_up</span>
<span>Tap any card to speak or listen</span>
</div>
</footer>
</div>
</body></html>
