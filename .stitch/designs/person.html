<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AMMA - Sunita (Week 28)</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;1,6..12,400&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            paper: "#F6EDE4",
            "cocoa-ink": "#3A2418",
            "muted-cocoa": "#7A6558",
            primary: "#C4513A",
            "on-primary": "#FFF8F3",
            sage: "#2F6F56",
            honey: "#E8A838",
            "urgent-rose": "#9B2331",
            "surface-card": "#FFFFFF",
            "warm-soft": "#FBF5EF",
            "terracotta-tint": "#F5E6DF"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Public Sans", "sans-serif"],
            label: ["Nunito Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #F6EDE4;
      color: #3A2418;
      font-family: 'Public Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill-current {
      font-variation-settings: 'FILL' 1;
    }
    .soft-shadow {
      box-shadow: 0 4px 20px -2px rgba(58, 36, 24, 0.06);
    }
    .action-card-shadow {
      box-shadow: 0 3px 14px -1px rgba(58, 36, 24, 0.05);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen bg-paper flex justify-center selection:bg-primary/20">
<!-- Main Mobile Container (Strict Single Column, Max-W 28rem) -->
<main class="w-full max-w-[28rem] min-h-screen flex flex-col justify-between px-5 pt-3 pb-8">
<!-- Top Navigation / Shared Component Header -->
<header class="flex justify-between items-center w-full py-3 mb-2">
<!-- Back Navigation Text Button -->
<button aria-label="Go back to family list" class="flex items-center gap-1 text-cocoa-ink hover:opacity-80 active:scale-95 transition-transform py-1 px-1 -ml-1 text-base font-semibold font-headline" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
<span class="tracking-tight">Back</span>
</button>
<!-- Center Headline: Sunita -->
<h1 class="font-headline text-xl font-bold text-cocoa-ink tracking-tight text-center">
        Sunita
      </h1>
<!-- Language Switcher Action (Shared Component Consistency) -->
<button aria-label="Change language" class="font-label text-sm font-semibold text-muted-cocoa bg-warm-soft px-3 py-1.5 rounded-full hover:opacity-80 active:scale-95 transition-transform border border-cocoa-ink/10" type="button">
        हिंदी / Eng
      </button>
</header>
<!-- Main Content Canvas -->
<div class="flex-1 flex flex-col gap-5 mt-1">
<!-- Status Card: Pregnant · 28 weeks -->
<section aria-labelledby="status-heading" class="bg-surface-card rounded-xl p-5 soft-shadow border border-cocoa-ink/5 relative overflow-hidden">
<!-- Ambient Cradle Art Accent (Subtle, Non-Cluttering) -->
<div class="absolute -right-6 -bottom-6 w-32 h-32 rounded-full bg-terracotta-tint/50 pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined text-primary/20 text-7xl select-none">
            nest_cam_stand
          </span>
</div>
<div class="relative z-10 flex flex-col items-start">
<!-- Top Row: Privacy PIN Badge -->
<div class="flex items-center justify-between w-full mb-3">
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold font-label bg-warm-soft text-muted-cocoa border border-cocoa-ink/10">
<span class="material-symbols-outlined text-[15px] text-cocoa-ink" style="font-variation-settings: 'FILL' 1;">lock</span>
              PIN on
            </span>
<span class="text-xs font-label text-muted-cocoa">Family device</span>
</div>
<!-- Headline -->
<h2 class="font-headline text-2xl font-bold text-cocoa-ink leading-tight mb-1" id="status-heading">
            Pregnant · 28 weeks
          </h2>
<!-- Subtext / Metadata -->
<p class="font-label text-sm font-medium text-muted-cocoa">
            Last session: <span class="text-cocoa-ink font-semibold">1 Oct</span>
</p>
<!-- Reassuring helper cue -->
<div class="mt-4 pt-3.5 border-t border-cocoa-ink/8 w-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-sage inline-block"></span>
<span class="font-body text-xs font-medium text-muted-cocoa">
              Third trimester has begun. Check in weekly.
            </span>
</div>
</div>
</section>
<!-- Primary Action: Start this week's session -->
<section>
<button aria-label="Start this week's health session" class="w-full h-16 bg-primary text-on-primary rounded-full px-6 flex items-center justify-between shadow-md shadow-primary/25 hover:brightness-105 active:scale-[0.98] transition-all group" type="button">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-2xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<span class="font-headline font-bold text-lg tracking-tight">
              Start this week's session
            </span>
</div>
<span class="material-symbols-outlined text-on-primary/80 group-hover:translate-x-1 transition-transform">
            arrow_forward
          </span>
</button>
</section>
<!-- 2-by-2 Grid of Soft White Action Cards -->
<section aria-label="Quick Actions" class="mt-1">
<div class="grid grid-cols-2 gap-3.5">
<!-- Card 1: Card for the clinic -->
<button class="bg-surface-card rounded-xl p-4 flex flex-col justify-between items-start text-left action-card-shadow border border-cocoa-ink/5 hover:border-cocoa-ink/15 active:scale-95 transition-all min-h-[128px]" type="button">
<div class="w-11 h-11 rounded-full bg-warm-soft flex items-center justify-center text-cocoa-ink mb-3">
<span class="material-symbols-outlined text-[24px]">assignment</span>
</div>
<div>
<span class="font-headline font-bold text-[15px] text-cocoa-ink leading-snug block">
                Card for the clinic
              </span>
<span class="font-label text-xs text-muted-cocoa mt-0.5 block">Medical records</span>
</div>
</button>
<!-- Card 2: Teach the phone my voice -->
<button class="bg-surface-card rounded-xl p-4 flex flex-col justify-between items-start text-left action-card-shadow border border-cocoa-ink/5 hover:border-cocoa-ink/15 active:scale-95 transition-all min-h-[128px]" type="button">
<div class="w-11 h-11 rounded-full bg-warm-soft flex items-center justify-center text-cocoa-ink mb-3">
<span class="material-symbols-outlined text-[24px]">mic</span>
</div>
<div>
<span class="font-headline font-bold text-[15px] text-cocoa-ink leading-snug block">
                Teach the phone my voice
              </span>
<span class="font-label text-xs text-muted-cocoa mt-0.5 block">Voice profile</span>
</div>
</button>
<!-- Card 3: Send danger-sign audio -->
<button class="bg-surface-card rounded-xl p-4 flex flex-col justify-between items-start text-left action-card-shadow border border-urgent-rose/15 hover:border-urgent-rose/30 active:scale-95 transition-all min-h-[128px] relative overflow-hidden group" type="button">
<div class="w-11 h-11 rounded-full bg-urgent-rose/10 flex items-center justify-center text-urgent-rose mb-3">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">notification_important</span>
</div>
<div>
<span class="font-headline font-bold text-[15px] text-cocoa-ink leading-snug block">
                Send danger-sign audio
              </span>
<span class="font-label text-xs text-urgent-rose font-semibold mt-0.5 block">Urgent help</span>
</div>
</button>
<!-- Card 4: Sources -->
<button class="bg-surface-card rounded-xl p-4 flex flex-col justify-between items-start text-left action-card-shadow border border-cocoa-ink/5 hover:border-cocoa-ink/15 active:scale-95 transition-all min-h-[128px]" type="button">
<div class="w-11 h-11 rounded-full bg-warm-soft flex items-center justify-center text-cocoa-ink mb-3">
<span class="material-symbols-outlined text-[24px]">menu_book</span>
</div>
<div>
<span class="font-headline font-bold text-[15px] text-cocoa-ink leading-snug block">
                Sources
              </span>
<span class="font-label text-xs text-muted-cocoa mt-0.5 block">Doctor advice &amp; care</span>
</div>
</button>
</div>
</section>
<!-- Trust & Privacy Note -->
<section class="mt-2 bg-warm-soft/70 border border-cocoa-ink/5 rounded-lg p-3 text-center">
<p class="font-body text-xs text-muted-cocoa leading-relaxed">
          AMMA works offline. Your recordings and symptoms stay on this phone until shared by you.
        </p>
</section>
</div>
<!-- Quiet Bottom Action: Delete this record -->
<footer class="pt-6 pb-2 text-center">
<button aria-label="Delete this maternal record" class="font-label text-sm font-medium text-muted-cocoa/80 hover:text-urgent-rose active:scale-95 transition-all underline underline-offset-4 decoration-cocoa-ink/20" type="button">
        Delete this record
      </button>
</footer>
</main>
<script>
    // Lightweight audio feedback simulation for low-literacy clarity
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        // Natural tap acknowledgment
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(10);
        }
      });
    });
  </script>
</body></html>
