# The bot's server is on a free plan that sleeps after fifteen minutes without a request,
# and then takes up to a minute to answer the next message. A request every ten minutes keeps it awake.
name: keep server awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://amma-server.onrender.com/health
