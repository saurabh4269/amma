  t_immunisation: "Ñakki liir bi"
  tfp_spacing: "Bàyyi 3 at ci diggante ñaari doom baax na ci wér-gi-yaramu yaay ji ak liir bi."
  tfp_fertility: "Boo wasinee ba noppi, man nga ëmbaat laata sa règles di dellusi."
  tfp_methods: "Man nga tànn bépp pexem teqale juddu bu Programme Planning Familial di joxe, niki stérilet (IUCD), pikiir, pilil walla kapot."
  tfp_iucd: "Stérilet (IUCD) mañ nañu ko def ci 48 waxtu yi topp ci wasin wi, walla gannaaw 6 ayu-bis ci wasin wi."
  tfp_complete: "Bu ngeen bëggatul doom, yow walla sa jëkkër man ngeen tànn pexe mu sax ngir bañ a ëmbati."
  tfp_free: "Bépp sarwiisu planning familial duñu ci fey dara ci bépp loppitaan ak poste de santé bu nguur gi."
  tim_birth: "Bu xale bi juddoo, dañu koy jox ñakku BCG, OPV ak Hépatite B. Ñakku Hépatite B war nañu ko jox ci 24 waxtu yi topp ci juddu gi."
  tim_visits: "Yóbbul xale bi ca bërëbu ñakk ba walla poste de santé ba la gën a jege, bu amee benn weer ak genn-wàll, ñaari weer ak genn-wàll, ñetti weer ak genn-wàll, ak 9 weer, ngir mu jot ñakk yi mu war a jot yépp."
  tim_m1: "Ci benn weer ak genn-wàll, kàrt bi dafa bind OPV-1, Penta-1, Rota-1, PCV-1 ak IPV-1."
  tim_m2: "Ci ñaari weer ak genn-wàll, kàrt bi dafa bind OPV-2, Penta-2 ak Rota-2."
  tim_m3: "Ci ñetti weer ak genn-wàll, kàrt bi dafa bind OPV-3, Penta-3, Rota-3, PCV-2 ak IPV-2."
  tim_states: "Am na ñetti ñakk yu amul fépp, ci yenn diiwaan ak yenn département rekk lañu am: JE, PCV ak Rotavirus."
  tim_keep: "Dencal bu baax kàrtu ñakk bi te indaale ko ci wisit bi ci topp."
  q_birth_vaccines_l: "Yan ñakk la liir bi di jot bu juddoo?"
  q_birth_vaccines_a: "Bu xale bi juddoo, dañu koy jox ñakku BCG, OPV ak Hépatite B. Ñakku Hépatite B war nañu ko jox ci 24 waxtu yi topp ci juddu gi."
  q_next_vaccines_l: "Kañ la ñakki liir bi ci topp?"
  q_next_vaccines_a: "Yóbbul xale bi ca bërëbu ñakk ba walla poste de santé ba la gën a jege, bu amee benn weer ak genn-wàll, ñaari weer ak genn-wàll, ñetti weer ak genn-wàll, ak 9 weer. Dencal bu baax kàrtu ñakk bi te indaale ko."
  q_spacing_l: "Ñaata jamono laa war a xaar laata ma am beneen doom?"
  q_spacing_a: "Bàyyi 3 at ci diggante ñaari doom baax na ci wér-gi-yaramu yaay ji ak liir bi."
  q_fp_methods_l: "Naka laa man a def ba yeexal ëmb bi ci topp?"
  q_fp_methods_a: "Man nga tànn bépp pexem teqale juddu bu Programme Planning Familial di joxe, niki stérilet (IUCD), pikiir, pilil walla kapot. Bu ngeen bëggatul doom, yow walla sa jëkkër man ngeen tànn pexe mu sax."
  q_solid_food_l: "Kañ laa war a tàmbali jox liir bi leneen lu mu lekk?"
  q_solid_food_a: "Kontineel di ko nàmpal. Bu matee 6 weer, tàmbalil jox liir bi 2 ba 3 kuddu yu mag ci lekk gu nooy te ñu moññ ko bu baax, 2 ba 3 yoon ci bés bi."
  q_hand_wash_l: "Kañ laa war a raxas samay loxo?"
  q_hand_wash_a: "Raxasal sa ñaari loxo ak saabu laata ngay togg, laata ngay leel xale bi, boo jógee wanag, ak boo fompee puubu xale bi ba noppi."
  s_decider_ask: "Kan ci sa waa kër mooy àndal ak yow ci dogal bi, bu ngeen waree dem loppitaan? Waxal tur wi ak nimero telefon bi."
  s_decider: "Ki may àndal ci dogal bi"
  s_escort_ask: "Kan mooy ànd ak yow loppitaan?"
  s_escort: "Ki may àndal"
  s_worker_ask: "Kan mooy sa bajenu gox walla sa sage-femme? Waxal tur wi ak nimero telefon bi."
  s_worker: "Sama bajenu gox walla sage-femme"
  s_facility_ask: "Ban loppitaan ngay dem? Tànn ko léegi, yow ak sa waa kër."
  s_facility: "Loppitaan"
  s_transport_ask: "Naka ngay def ba egg fa? Waxal tur ak nimero sofëer bi walla ambilaas bi."
  s_transport: "Transport"
  s_money_ask: "Ndax waa kër gi denc nañu tuuti xaalis ngir bu jafe-jafe bu gaaw amee?"
  s_money: "Xaalis bu ñu denc"
  p_recall_ask: "Yan màndarga ñoo tax nga war a dem loppitaan léegi-léegi? Wax ma benn."
  p_recall_more: "Ndax am na beneen?"
  p_recall_missed: "Màndarga yu raglu yii nga waxul bii yoon, ñoo ngi nii."
  p_recall_all: "Fàttaliku nga leen yépp."
  p_check_intro: "Léegi dinaa la laaj ci màndarga mu nekk. Tontul waaw, déedéet, walla wóoruma."
  p_open_ask: "Ndax am na loo bëgg a laaj, walla lenn lu la neexul ci sa yaram?"
  p_open_more: "Am na leneen?"
  p_did_you_say: "Ndax dangaa wax:"
  p_not_sure: "Loolu wóoruma ko. Laajal nit: sa bajenu gox, sa sage-femme walla doktoor."
  p_yes: "Waaw"
  p_no: "Déedéet"
  p_unsure: "Wóoruma"
  p_done: "Lépp a ngi noonu"
  p_plan_intro: "Ci njëlbéen, nanu defar sa plan ngir bu jafe-jafe bu gaaw amee. Defal ko ak sa waa kër."
  p_plan_playback: "Lii mooy sa plan. Boo amee màndarga mu raglu, woowal nit ñii te dem ci bërëb bii."
  p_clarify_summary: "Bàyyi ma ma waxaat ko. Ndax noonu la?"
  p_track_intro: "Lenn loo war a xam ayu-bis bii."
  q_checkups_l: "Ñaata wisit laa soxla?"
  q_checkups_a: "Bindul ci poste de santé bi ci ñetti weer yu njëkk yi. Defal lu mu néew néew 3 wisitu biir gannaaw boo binduwee. Ci wisit bu nekk, nañu natt sa tension te seet sa deret ak sa saw."
  q_iron_l: "Naka laay jële kompirime fer yi?"
  q_iron_a: "Jëlal benn kompirime fer ak acide folique bés bu nekk, lu mu néew néew 6 weer, gannaaw ñetti weer yu njëkk yu ëmb bi. Jëlal lu mu néew néew 180 kompirime."
  q_calcium_l: "Naka laay jële kompirime calcium yi?"
  q_calcium_a: "Jëlal ñaari kompirime calcium bés bu nekk, lu mu néew néew 6 weer, gannaaw ñetti weer yu njëkk yu ëmb bi."
  q_rest_l: "Ñaata laa war a noppalu?"
  q_rest_a: "Noppalul lu mu néew néew ñaari waxtu ci bëccëg, te yokk ko ci 8 waxtu yu ngay noppalu ci guddi."
  q_weight_l: "Ñaata kilo laa war a yokk?"
  q_weight_a: "Ci wisit bu nekk, nañu natt sa diisaay. Yokkal lu mu néew néew 9 ba 11 kilo ci ëmb bi, ak lu mu néew néew 1 kilo weer wu nekk ci 6 weer yu mujj yi."
  q_cost_l: "Ndax damay fey ngir wasin wi?"
  q_cost_a: "Ci loppitaanu nguur gi, ci Janani-Shishu Suraksha Karyakram, wasin wi doo ci fey dara te doo génne xaalis. Césarienne, garab yi, analyse yi, deret ak lekk gi ci jamono ji nga fay nekk, ñoom itam doo ci fey dara."
  q_ride_l: "Ndax damay fey transport bi ma yóbbu loppitaan?"
  q_ride_a: "Transport bi doo ci fey dara: jóge sa kër ba ca bërëbu paj ma, ci diggante bërëbi paj yi bu ñu la yónnee feneen, ak dellusi sa kër."
  q_doctor_day_l: "Kañ la ma doktoor man a seet?"
  q_doctor_day_a: "Ci ñetti weer yi ci digg bi walla ñetti weer yu mujj yu ëmb bi, na la doktoor seet lu mu néew néew benn yoon, ci 9eelu fanu weer wi."
  q_where_birth_l: "Fan laa war a wasine?"
  q_where_birth_a: "Li gën mooy nga wasin ci bërëbu paj, ak ku xam wasinloo bu baax. Tànnal loppitaan bi te waajal transport bi lu jiitu. Toogal fa 48 waxtu gannaaw wasin wi."
  q_first_feed_l: "Kañ laay tàmbali nàmpal?"
  q_first_feed_a: "Tàmbalil nàmpal ci 1 waxtu bi topp ci juddu gi."
  q_baby_food_l: "Lan laay jox liir bi mu lekk?"
  q_baby_food_a: "Meewum yaay rekk ngay jox liir bi. Tàmbali nàmpal bu gaaw dafay dimbali yaay ji mu nàmpal rekk, bañ a boole leneen, ci 6 weer."
  q_baby_bath_l: "Kañ laa man a sang liir bi?"
  q_baby_bath_a: "Bul sang liir bi ci 48 waxtu yu njëkk yi. Na yaramu liir bi tàng, bu mu sedd."
  q_cord_l: "Naka laay toppatoo lutt bi (cordon)?"
  q_cord_a: "Na lutt bi (cordon) wow, bu mu tooy."
  q_small_baby_l: "Sama liir dafa tuuti lool. Lan laa war a def?"
  q_small_baby_a: "Liir bu matul 2,5 kilo bi mu juddoo, dafa soxla toppatoo bu yemul. Bu liir bi matul 2 kilo, jokkool ak sage-femme bi ngir mu dimbali la ci nàmpal ak ci méthode kangourou."
  out_preg_urgent: "Am nga màndarga mu raglu. Demal léegi-léegi ci loppitaan bi la gën a jege te mën la faj. Wax ko sa waa kër léegi."
  out_mother_urgent: "Yaay ji, am nga màndarga mu raglu. Demal loppitaan léegi-léegi. Wax ko sa waa kër léegi."
  out_newborn_urgent: "Liir bi am na màndarga mu raglu. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  out_ask: "Am na màndarga mu la wóorul woon. Waxal ak sa bajenu gox walla sa sage-femme tey."
  out_none: "Tey, amoo benn ci màndarga yu raglu yi ñu lim. Jafe-jafe man na ñëw te du yégle, kon boo jaaxlee, waxal ak sa bajenu gox walla sa sage-femme."
  pp_bleeding_l: "Deret ju bare lool gannaaw wasin wi"
  pp_bleeding_t: "Deret ju bare lool juy génn gannaaw wasin wi, màndarga mu raglu la ci yaay ji. Demal loppitaan léegi-léegi."
  pp_bleeding_a: "Yaay ji: li dale ci bi nu mujjee waxtaan, ndax deret ju bare lool génn na ci yow?"
  pp_fever_l: "Yaram wu tàng lool ci weer wi topp ci wasin wi"
  pp_fever_t: "Yaram wu tàng lool ci weer wi topp ci wasin wi, màndarga mu raglu la ci yaay ji. Demal loppitaan léegi-léegi."
  pp_fever_a: "Yaay ji: li dale ci bi nu mujjee waxtaan, ndax sa yaram tàng na lool?"
  pp_fits_l: "Kiriis"
  pp_fits_t: "Kiriis, màndarga mu raglu la ci yaay ji. Demal loppitaan léegi-léegi."
  pp_fits_a: "Yaay ji: li dale ci bi nu mujjee waxtaan, ndax am nga kiriis?"
  pp_headache_l: "Bopp buy metti lool ak gis-gis bu lëndëm"
  pp_headache_t: "Bopp buy metti lool ak gis-gis bu lëndëm, màndarga mu raglu la ci yaay ji. Demal loppitaan léegi-léegi."
  pp_headache_a: "Yaay ji: li dale ci bi nu mujjee waxtaan, ndax sa bopp metti na lool te sa gis-gis lëndëm?"
  pp_breathing_l: "Noyyi bu gaaw walla bu jafe"
  pp_breathing_t: "Noyyi bu gaaw walla bu jafe, màndarga mu raglu la ci yaay ji. Demal loppitaan léegi-léegi."
  pp_breathing_a: "Yaay ji: li dale ci bi nu mujjee waxtaan, ndax sa noyyi dafa gaaw walla dafa jafe?"
  pp_calf_l: "Mettit, xonq walla newi ci yeel bi (mollet), walla mettitu dënn"
  pp_calf_t: "Mettit, xonq walla newi ci yeel bi (mollet), walla mettitu dënn, màndarga mu raglu la ci yaay ji. Demal loppitaan léegi-léegi."
  pp_calf_a: "Yaay ji: li dale ci bi nu mujjee waxtaan, ndax am nga mettit, xonq walla newi ci yeel bi (mollet), walla mettitu dënn?"
  nb_feed_l: "Liir bi manul a nàmp"
  nb_feed_t: "Liir bu manul a nàmp, ci musiba la nekk. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_feed_a: "Liir bi: ndax liir bi manul a nàmp?"
  nb_fits_l: "Liir bi am na kiriis (convulsions)"
  nb_fits_t: "Kiriis (convulsions) ci liir bi, màndarga mu raglu la. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_fits_a: "Liir bi: ndax liir bi am na kiriis (convulsion)?"
  nb_breathing_l: "Liir bi dafay noyyi bu gaaw"
  nb_breathing_t: "Liir buy noyyi bu gaaw, lu ëpp 60 noyyi ci benn minit, màndarga mu raglu la. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_breathing_a: "Liir bi: ndax liir bi dafay noyyi bu gaaw?"
  nb_chest_l: "Dënnu liir bi dafay dugg ci biir bu muy noyyi"
  nb_chest_t: "Dënn buy dugg lool ci biir, maanaam dënnu liir bi di dugg ci biir noyyi bu nekk, màndarga mu raglu la. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_chest_a: "Liir bi: ndax dënnu liir bi dafay dugg lool ci biir noyyi bu nekk?"
  nb_hot_l: "Yaramu liir bi dafa tàng boo ko laalee"
  nb_hot_t: "Liir bu yaramam tàng boo ko laalee, ci musiba la nekk. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_hot_a: "Liir bi: ndax yaramu liir bi dafa tàng boo ko laalee?"
  nb_cold_l: "Yaramu liir bi dafa sedd boo ko laalee"
  nb_cold_t: "Liir bu yaramam sedd boo ko laalee, ci musiba la nekk. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_cold_a: "Liir bi: ndax yaramu liir bi dafa sedd boo ko laalee?"
  nb_movement_l: "Liir bi du yëngu lu dul boo ko laalee, walla du yëngu dara"
  nb_movement_t: "Liir bu dul yëngu lu dul bu ñu ko yëngalee, walla bu dul yëngu dara, ci musiba la nekk. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_movement_a: "Liir bi: ndax liir bi du yëngu lu dul boo ko laalee, walla du yëngu dara?"
  nb_yellow_l: "Biir loxo ak suufu tànki liir bi dañu mboq (jaune)"
  nb_yellow_t: "Der bu mboq (jaune) ci bés bu njëkk bi, walla biir loxo ak suufu tànk yu mboq ci at mu mu man a am, màndarga mu raglu la ci liir bi. Jokkool ak sa liggéeykatu wér-gi-yaram léegi-léegi."
  nb_yellow_a: "Liir bi: ndax biir loxo walla suufu tànki liir bi dañu mboq (jaune), walla der bi dafa mboq woon ci bés bu njëkk bi?"
  bleeding_l: "Deret juy génn ci jamonoy ëmb"
  bleeding_t: "Deret juy génn ci jamonoy ëmb, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  bleeding_a: "Li dale ci bi nu mujjee waxtaan, ndax deret génn na ci yow?"
  breathless_l: "Deret ju néew lool (anémie), ànd ak noyyi bu jafe walla déet"
  breathless_t: "Anémie bu tar, maanaam deret ju néew lool, ànd ak noyyi bu jafe walla déet, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  breathless_a: "Li dale ci bi nu mujjee waxtaan, ndax sa noyyi dafa jafe, walla liggéeykatu wér-gi-yaram wax na la ne sa deret dafa néew lool?"
  fever_l: "Yaram wu tàng lool (fièvre)"
  fever_t: "Yaram wu tàng lool ci jamonoy ëmb, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  fever_a: "Li dale ci bi nu mujjee waxtaan, ndax sa yaram tàng na lool?"
  headache_l: "Bopp buy metti ak gis-gis bu lëndëm"
  headache_t: "Bopp buy metti ak gis-gis bu lëndëm, màndarga yu raglu lañu. Demal loppitaan léegi-léegi."
  headache_a: "Li dale ci bi nu mujjee waxtaan, ndax sa bopp metti na, walla sa gis-gis lëndëm na?"
  fits_l: "Kiriis"
  fits_t: "Kiriis, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  fits_a: "Li dale ci bi nu mujjee waxtaan, ndax am nga kiriis?"
  swelling_l: "Yaram wépp a newi"
  swelling_t: "Yaram wépp a newi, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  swelling_a: "Li dale ci bi nu mujjee waxtaan, ndax sa yaram wépp newi na?"
  early_pains_l: "Mettitu wasin laata jamono ji di jot"
  early_pains_t: "Mettitu wasin laata jamono ji di jot, laata 37 ayu-bis, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  early_pains_a: "Li dale ci bi nu mujjee waxtaan, ndax am nga mettitu wasin te jamonoy wasin wi jotagul?"
  movement_l: "Doom ji ci biir wàññi na yëngu"
  movement_t: "Doom ji ci biir bu wàññee yëngu ni mu daan yëngoo, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  movement_a: "Li dale ci bi nu mujjee waxtaan, ndax doom ji ci biir wàññi na yëngu ni mu daan yëngoo?"
  waters_l: "Ndoxum biir mi tuuru te mettitu wasin amul"
  waters_t: "Ndoxum biir mi bu tuuroo te mettitu wasin amul, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  waters_a: "Li dale ci bi nu mujjee waxtaan, ndax sa ndoxum biir tuuru na, walla ndox génn na, te mettitu wasin amul?"
  long_labour_l: "Mettitu wasin bu ëpp 12 waxtu"
  long_labour_t: "Bu wasin wi jotee: mettitu wasin bu ëpp 12 waxtu, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  long_labour_a: "Ndax mettitu wasin wi ëpp na 12 waxtu?"
  birth_bleeding_l: "Deret ju bare lool ci jamonoy wasin"
  birth_bleeding_t: "Bu wasin wi jotee: deret ju bare lool ci jamonoy wasin wi walla gannaaw ga, màndarga mu raglu la. Demal loppitaan léegi-léegi."
  birth_bleeding_a: "Ndax deret ju bare lool mu ngi génn ci jamonoy wasin wi?"
  pp_breast_l: "Ween walla boppu ween yu newi, yu xonq walla yuy metti boo leen laalee"
  pp_breast_t: "Say ween walla say boppu ween dañu newi, dañu xonq walla dañuy metti boo leen laalee."
  pp_breast_a: "Yaay ji: ndax say ween walla say boppu ween dañu newi, dañu xonq walla dañuy metti boo leen laalee?"
  pp_urine_l: "Jafe-jafe ci saw, walla saw muy rëcc"
  pp_urine_t: "Am nga jafe-jafe ci saw, walla saw mi dafay rëcc."
  pp_urine_a: "Yaay ji: ndax am nga jafe-jafe ci saw, walla saw mi dafay rëcc?"
  pp_wound_l: "Mettit wu yokku walla infection ci fi xottiku walla fi ñu ñaw"
  pp_wound_t: "Mettit wi yokku na, walla am na infection, ci fi xottiku walla fi ñu ñaw."
  pp_wound_a: "Yaay ji: ndax mettit wi yokku na, walla am na infection, ci fi xottiku walla fi ñu ñaw?"
  pp_discharge_l: "Ndox mu xasaw muy génn"
  pp_discharge_t: "Am na ndox mu xasaw muy génn ci sa yoonu wasin."
  pp_discharge_a: "Yaay ji: ndax am na ndox mu xasaw muy génn ci sa yoonu wasin?"
  nb_eyes_l: "Dëtt (pus) muy génn ci bëti liir bi"
  nb_eyes_t: "Dëtt (pus) mu ngi génn ci bëti liir bi."
  nb_eyes_a: "Liir bi: ndax dëtt (pus) mu ngi génn ci bëti liir bi?"
  nb_cord_l: "Lutt bi (cordon) am na dëtt (pus) walla deret"
  nb_cord_t: "Lutt bi (cordon) dafa xonq te metti, am dëtt (pus) walla deret."
  nb_cord_a: "Liir bi: ndax lutt bi (cordon) dafa xonq te metti, am dëtt (pus) walla deret?"
  nb_mouth_l: "Tomb yu weex walla góom ci gémmiñu liir bi"
  nb_mouth_t: "Liir bi am na góom walla tomb yu weex ci gémmiñ gi."
  nb_mouth_a: "Liir bi: ndax am na góom walla tomb yu weex ci gémmiñu liir bi?"
  out_mother_soon: "Yaay ji, demal poste de santé bi lu gën a gaaw. Wax ko sa bajenu gox walla sa sage-femme tey."
  out_newborn_soon: "Yóbbul liir bi poste de santé bi lu gën a gaaw. Wax ko sa bajenu gox walla sa sage-femme tey."
  t_pregnancy_care: "Toppatoo ci jamonoy ëmb"
  t_first_pregnancy: "Ëmb bu njëkk"
  t_anaemia: "Deret ju néew (anémie)"
  t_diabetes: "Suukar ci jamonoy ëmb (diabète)"
  t_entitlements: "Li nga dul fey"
  t_after_birth_care: "Toppatoo gannaaw wasin wi"
  tc_register: "Wisit yu toftaloo ci jamonoy ëmb, lu manul a ñàkk la. Bindul ci poste de santé bi ci ñetti weer yu njëkk yi."
  tc_bp: "Ci wisit bu nekk, nañu natt sa tension te seet sa deret ak sa saw."
  tc_tt: "Jëlal ñaari pikiiru T.T.: bu njëkk bi bu ñu wóoralee ne ëmb nga, ñaareel bi gannaaw 1 weer."
  tc_iron: "Jëlal benn kompirime fer ak acide folique bés bu nekk, lu mu néew néew 6 weer, gannaaw ñetti weer yu njëkk yi. Jëlal lu mu néew néew 180 kompirime."
  tc_calcium: "Jëlal ñaari kompirime calcium bés bu nekk, lu mu néew néew 6 weer, gannaaw ñetti weer yu njëkk yi."
  tc_rest: "Noppalul lu mu néew néew ñaari waxtu ci bëccëg, te yokk ko ci 8 waxtu yu ngay noppalu ci guddi."
  tc_salt: "Xorom su am iode rekk ngay jëfandikoo. Jëlal lekk gu ñuy yokk gi ci Anganwadi bi, te bul ko dog."
  tc_prepare: "Tànnal loppitaan bi lu jiitu. Waajal transport bi lu jiitu. Toogal 48 waxtu ci bërëbu paj mi gannaaw wasin wi."
  tc_family: "Boo amee benn màndarga mu raglu, wax ko sa waa kër léegi-léegi."
  tf_warning: "Bépp jigéen man na am jafe-jafe ci jamonoy ëmb. Ci yenn jigéen ñi, dañuy ñëw te duñu yégle. Loolu moo tax ngay jàng màndarga yu raglu yi."
  tf_inform: "Sa bajenu gox mooy nit ki ngay jëkk a jokkool ngir bépp sarwiis walla xibaar ci jamonoy ëmb."
  tf_husband: "Sa jëkkër war na ànd ak yow ci wisit yi, jàng màndarga yu raglu yi, te xam nimero yu jafe-jafe bu gaaw, boole ci nimero ambilaas bi."
  ta_tablet: "Jëlal benn kompirime bu xonq bu fer ak acide folique bés bu nekk, ci 180 fan, tàmbalee ci ñeenteelu weeru ëmb bi."
  ta_food: "Lekkal ñam yu bare fer yu am ci sa gox, boole ko ak vitamine C, mooy dimbali yaram wi mu jël fer bi."
  ta_after: "Gannaaw wasin wi, kontineel di jël benn kompirime bu xonq bu fer ak acide folique bés bu nekk, ci 180 fan."
  td_test: "Analyse suukar bi dañu koy def ci wisit bu njëkk bi. Bu baaxee, dañu koy defaat ci diggante 24 ak 28 ayu-bis. Dangay naan glucose ci ndox, xaar 2 waxtu ngir analyse bi."
  td_walk: "Boo amee diabète ci jamonoy ëmb, doxal walla defal espoor 30 minit bés bu nekk, te topp ni infirmière bi la wax nga lekke."
  td_food: "Bul wàññi sa lekk ba mu ëpp. Lekk lu néew lool man na lor màggug liir bi."
  td_after: "Suukar bi dafay faral di dellu ni mu waree gannaaw wasin wi. Sage-femme bi war na seetaat sa suukar 6 ayu-bis gannaaw wasin wi. Laajal analyse boobu."
  te_free: "Ci loppitaanu nguur gi, sa wasin doo ci fey dara te doo génne xaalis, boole ci césarienne, garab yi, analyse yi, deret, ak lekk gi ci jamono ji nga fay nekk."
  te_transport: "Transport bi doo ci fey dara: jóge sa kër ba ca bërëbu paj ma, ci diggante bërëbi paj yi bu ñu la yónnee feneen, ak dellusi sa kër."
  te_jsy: "Ci Janani Suraksha Yojana, yaay ju ko yeyoo dina jot ndimbalu xaalis ngir wasin ci bërëbu paj bu nguur gi. Laajal sa bajenu gox mu bind la."
  te_baby: "Liir bu feebar, ba mu am benn at gannaaw juddoom, paj mi, garab yi, analyse yi ak transport bi, duñu ci fey dara."
  tb_visits: "Gannaaw wasin wi, dañuy seet yaay ji ak liir bi ci bésu 1, bésu 3, bésu 7, ak ci 6 ayu-bis."
  tb_asha: "Sa bajenu gox dafay ñëw seetsi la ak liir bi ci sa kër ci bésu 3, 7, 14, 21, 28 ak 42 gannaaw wasin wi."
  tb_tablets: "Jëlal benn kompirime fer ak acide folique ak ñaari kompirime calcium bés bu nekk, lu mu néew néew 6 weer gannaaw wasin wi."
  tb_pad: "Jëfandikool serviette hygiénique bu set ngir moytu infection."
  tb_warm: "Na yaramu liir bi tàng, bu mu sedd. Bul sang liir bi ci 48 waxtu yu njëkk yi. Na lutt bi (cordon) wow."
  tb_milk: "Meewum yaay rekk ngay jox liir bi."
  tb_sick: "Sorele liir bi ak nit ñu feebar."
  tb_someone: "Na am saa su nekk kenn ci wetu yaay ji, lu mu néew néew 24 waxtu gannaaw wasin wi."
