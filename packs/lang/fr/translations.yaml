  t_first_pregnancy: "Première grossesse"
  t_anaemia: "Manque de sang (anémie)"
  t_diabetes: "Sucre pendant la grossesse (diabète)"
  t_entitlements: "Ce qui est gratuit pour vous"
  t_after_birth_care: "Les soins après la naissance"
  tc_register: "Des consultations régulières sont indispensables pendant la grossesse. Inscrivez-vous au centre de santé pendant les trois premiers mois."
  tc_bp: "À chaque visite, faites prendre votre tension et faites examiner votre sang et vos urines."
  tc_tt: "Faites deux injections contre le tétanos : la première quand la grossesse est confirmée et la deuxième 1 mois après."
  tc_iron: "Prenez un comprimé de fer et acide folique par jour pendant au moins 6 mois, après les trois premiers mois. Prenez au moins 180 comprimés."
  tc_calcium: "Prenez deux comprimés de calcium par jour pendant au moins 6 mois, après les trois premiers mois."
  tc_rest: "Reposez-vous au moins deux heures dans la journée, en plus de 8 heures de repos la nuit."
  tc_salt: "Utilisez seulement du sel iodé. Prenez régulièrement le complément alimentaire du centre Anganwadi."
  tc_prepare: "Choisissez l'hôpital à l'avance. Organisez le transport à l'avance. Restez 48 heures dans la structure de santé après l'accouchement."
  tc_family: "Si vous avez un signe de danger, prévenez tout de suite les membres de votre famille."
  tf_warning: "Toute femme peut avoir des complications pendant la grossesse. Chez certaines femmes, elles arrivent sans prévenir. C'est pour cela que vous apprenez les signes de danger."
  tf_inform: "Votre agent de santé communautaire est la première personne à contacter pour tout service ou toute information pendant la grossesse."
  tf_husband: "Votre mari doit venir avec vous aux consultations, apprendre les signes de danger et connaître les numéros d'urgence, y compris celui de l'ambulance."
  ta_tablet: "Prenez un comprimé rouge de fer et acide folique chaque jour pendant 180 jours, à partir du quatrième mois de la grossesse."
  ta_food: "Mangez des aliments riches en fer que l'on trouve chez vous, avec de la vitamine C, qui aide le corps à prendre le fer."
  ta_after: "Après la naissance, continuez à prendre un comprimé rouge de fer et acide folique chaque jour pendant 180 jours."
  td_test: "Le test du sucre est fait à la première consultation. S'il est normal, il est refait entre 24 et 28 semaines. Vous buvez du glucose dans de l'eau et vous attendez 2 heures pour le test."
  td_walk: "Avec le diabète pendant la grossesse, marchez ou faites de l'exercice 30 minutes par jour, et suivez le plan de repas que l'infirmière vous donne."
  td_food: "Ne réduisez pas fortement ce que vous mangez. Manger beaucoup trop peu peut nuire à la croissance du bébé."
  td_after: "Le sucre revient le plus souvent à la normale après l'accouchement. La sage-femme doit refaire votre test du sucre 6 semaines après la naissance. Demandez ce test."
  te_free: "Dans un hôpital public, votre accouchement est gratuit et vous n'avez rien à payer, y compris la césarienne, les médicaments, les examens, le sang et les repas pendant votre séjour."
  te_transport: "Le transport est gratuit de la maison jusqu'à la structure de santé, d'une structure à une autre si on vous y envoie, et pour le retour à la maison."
  te_jsy: "Avec le programme Janani Suraksha Yojana, une mère qui y a droit reçoit une aide en argent pour accoucher dans une structure publique de santé. Demandez à votre agent de santé communautaire de vous inscrire."
  te_baby: "Pour un bébé malade, jusqu'à un an après la naissance, les soins, les médicaments, les examens et le transport sont gratuits."
  tb_visits: "Après la naissance, la mère et le bébé sont examinés le jour 1, le jour 3, le jour 7 et à 6 semaines."
  tb_asha: "Votre agent de santé communautaire vient vous voir, vous et le bébé, à la maison les jours 3, 7, 14, 21, 28 et 42 après la naissance."
  tb_tablets: "Prenez un comprimé de fer et acide folique et deux comprimés de calcium par jour pendant au moins 6 mois après l'accouchement."
  tb_pad: "Utilisez une serviette hygiénique propre pour éviter l'infection."
  tb_warm: "Gardez le bébé au chaud. Ne lavez pas le bébé pendant les 48 premières heures. Gardez le cordon sec."
  tb_milk: "Donnez au bébé seulement le lait maternel."
  tb_sick: "Gardez le bébé loin des personnes malades."
  tb_someone: "Il faut toujours quelqu'un près de la mère pendant au moins 24 heures après l'accouchement."
