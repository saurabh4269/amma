  tim_birth: "À la naissance, l'enfant reçoit le BCG, le vaccin polio oral (VPO) et le vaccin contre l'hépatite B. Le vaccin contre l'hépatite B doit être donné dans les 24 heures après la naissance."
  tim_visits: "Amenez l'enfant à la séance de vaccination ou à la structure de santé la plus proche à un mois et demi, deux mois et demi, trois mois et demi et 9 mois, pour tous les vaccins prévus."
  tim_m1: "À un mois et demi, le carnet indique VPO-1, Penta-1, Rota-1, PCV-1 et VPI-1."
  tim_m2: "À deux mois et demi, le carnet indique VPO-2, Penta-2 et Rota-2."
  tim_m3: "À trois mois et demi, le carnet indique VPO-3, Penta-3, Rota-3, PCV-2 et VPI-2."
  tim_states: "Trois vaccins sont disponibles seulement dans certains États et districts : encéphalite japonaise, PCV et rotavirus."
  tim_keep: "Gardez bien le carnet de vaccination et apportez-le à la prochaine visite."
  q_birth_vaccines_l: "Quels vaccins le bébé reçoit-il à la naissance ?"
  q_birth_vaccines_a: "À la naissance, l'enfant reçoit le BCG, le vaccin polio oral (VPO) et le vaccin contre l'hépatite B. Le vaccin contre l'hépatite B doit être donné dans les 24 heures après la naissance."
  q_next_vaccines_l: "Quand sont les prochains vaccins du bébé ?"
  q_next_vaccines_a: "Amenez l'enfant à la séance de vaccination ou à la structure de santé la plus proche à un mois et demi, deux mois et demi, trois mois et demi et 9 mois. Gardez bien le carnet de vaccination et apportez-le."
  q_spacing_l: "Combien de temps dois-je attendre avant le prochain enfant ?"
  q_spacing_a: "Laisser 3 ans entre deux enfants est bon pour la santé de la mère et du bébé."
  q_fp_methods_l: "Comment puis-je retarder la prochaine grossesse ?"
  q_fp_methods_a: "Vous pouvez choisir n'importe quelle méthode d'espacement proposée par le Programme de planification familiale, comme le stérilet (DIU), l'injection, la pilule ou le préservatif. Si vous avez tous les enfants que vous voulez, vous ou votre mari pouvez choisir une méthode définitive."
  q_solid_food_l: "Quand est-ce que je commence à donner d'autres aliments au bébé ?"
  q_solid_food_a: "Continuez à allaiter. Quand le bébé a 6 mois révolus, commencez à lui donner 2 à 3 cuillères à soupe d'aliments mous et bien écrasés, 2 à 3 fois par jour."
  q_hand_wash_l: "Quand dois-je me laver les mains ?"
  q_hand_wash_a: "Lavez-vous les deux mains avec du savon avant de préparer à manger, avant de donner à manger à l'enfant, après être allée à la selle et après avoir nettoyé les selles de l'enfant."
  s_decider_ask: "Qui dans la famille décide avec vous quand il faut aller à l'hôpital ? Donnez le nom et le numéro de téléphone."
  s_decider: "Décide avec moi"
  s_escort_ask: "Qui va vous accompagner à l'hôpital ?"
  s_escort: "M'accompagne"
  s_worker_ask: "Qui est votre agent de santé communautaire ou votre sage-femme ? Donnez le nom et le numéro de téléphone."
  s_worker: "Mon agent de santé communautaire ou ma sage-femme"
  s_facility_ask: "Dans quel hôpital allez-vous aller ? Choisissez-le maintenant, avec votre famille."
  s_facility: "Hôpital"
  s_transport_ask: "Comment allez-vous y aller ? Donnez le nom et le numéro du chauffeur ou de l'ambulance."
  s_transport: "Transport"
  s_money_ask: "Est-ce que la famille a mis un peu d'argent de côté pour une urgence ?"
  s_money: "Argent mis de côté"
  p_recall_ask: "Quels signes veulent dire que vous devez aller à l'hôpital tout de suite ? Dites-m'en un."
  p_recall_more: "Est-ce qu'il y en a un autre ?"
  p_recall_missed: "Voici les signes de danger que vous n'avez pas dits cette fois."
  p_recall_all: "Vous vous êtes souvenue de tous les signes."
  p_check_intro: "Maintenant je vais vous poser une question sur chaque signe. Répondez oui, non, ou pas sûre."
  p_open_ask: "Est-ce que vous voulez demander quelque chose, ou est-ce que quelque chose ne va pas ?"
  p_open_more: "Autre chose ?"
  p_did_you_say: "Est-ce que vous avez dit :"
  p_not_sure: "Je ne suis pas sûre de cela. Demandez à une personne : votre agent de santé communautaire, votre sage-femme ou le médecin."
  p_yes: "Oui"
  p_no: "Non"
  p_unsure: "Pas sûre"
  p_done: "C'est tout"
  p_plan_intro: "D'abord, faisons votre plan pour une urgence. Faites-le avec votre famille."
  p_plan_playback: "Voici votre plan. Si vous avez un signe de danger, appelez ces personnes et allez à cet endroit."
  p_clarify_summary: "Je vous le redis. Est-ce que c'est bien cela ?"
  p_track_intro: "Une chose à savoir cette semaine."
  q_checkups_l: "Combien de consultations dois-je faire ?"
  q_checkups_a: "Inscrivez-vous au centre de santé pendant les trois premiers mois. Faites au moins 3 consultations prénatales après l'inscription. À chaque visite, faites prendre votre tension et faites examiner votre sang et vos urines."
  q_iron_l: "Comment dois-je prendre les comprimés de fer ?"
  q_iron_a: "Prenez un comprimé de fer et acide folique par jour pendant au moins 6 mois, après les trois premiers mois de la grossesse. Prenez au moins 180 comprimés."
  q_calcium_l: "Comment dois-je prendre les comprimés de calcium ?"
  q_calcium_a: "Prenez deux comprimés de calcium par jour pendant au moins 6 mois, après les trois premiers mois de la grossesse."
  q_rest_l: "Combien de temps dois-je me reposer ?"
  q_rest_a: "Reposez-vous au moins deux heures dans la journée, en plus de 8 heures de repos la nuit."
  q_weight_l: "Combien de kilos dois-je prendre ?"
  q_weight_a: "Faites-vous peser à chaque visite. Prenez au moins 9 à 11 kilos pendant la grossesse, et au moins 1 kilo chaque mois pendant les 6 derniers mois."
  q_cost_l: "Est-ce que je dois payer pour l'accouchement ?"
  q_cost_a: "Dans un hôpital public, avec le programme Janani-Shishu Suraksha Karyakram, l'accouchement est gratuit et vous n'avez rien à payer. La césarienne, les médicaments, les examens, le sang et les repas pendant le séjour sont aussi gratuits."
  q_ride_l: "Est-ce que je dois payer le transport jusqu'à l'hôpital ?"
  q_ride_a: "Le transport est gratuit de la maison jusqu'à la structure de santé, d'une structure à une autre si on vous y envoie, et pour le retour à la maison."
  q_doctor_day_l: "Quand est-ce qu'un médecin peut m'examiner ?"
  q_doctor_day_a: "Pendant les trois mois du milieu ou les trois derniers mois de la grossesse, faites au moins une consultation avec un médecin le 9 du mois."
  q_where_birth_l: "Où dois-je accoucher ?"
  q_where_birth_a: "Il est conseillé d'accoucher dans une structure de santé, avec un personnel qualifié pour l'accouchement. Choisissez l'hôpital et organisez le transport à l'avance. Restez 48 heures après l'accouchement."
  q_first_feed_l: "Quand est-ce que je commence à allaiter ?"
  q_first_feed_a: "Commencez à allaiter dans l'heure qui suit la naissance."
  q_baby_food_l: "Qu'est-ce que je donne à manger au bébé ?"
  q_baby_food_a: "Donnez au bébé seulement le lait maternel. Allaiter tôt aide la mère à donner seulement le sein pendant 6 mois."
  q_baby_bath_l: "Quand est-ce que je peux laver le bébé ?"
  q_baby_bath_a: "Ne lavez pas le bébé pendant les 48 premières heures. Gardez le bébé au chaud."
  q_cord_l: "Comment est-ce que je m'occupe du cordon ?"
  q_cord_a: "Gardez le cordon sec."
  q_small_baby_l: "Mon bébé est très petit. Qu'est-ce que je dois faire ?"
  q_small_baby_a: "Un bébé qui pèse moins de 2,5 kilos à la naissance a besoin de soins spéciaux. Si le bébé pèse moins de 2 kilos, contactez la sage-femme pour vous aider avec l'allaitement et la méthode kangourou."
  out_preg_urgent: "Vous avez un signe de danger. Allez tout de suite à l'hôpital adapté le plus proche. Prévenez votre famille maintenant."
  out_mother_urgent: "Maman, vous avez un signe de danger. Allez tout de suite à l'hôpital. Prévenez votre famille maintenant."
  out_newborn_urgent: "Le bébé a un signe de danger. Contactez tout de suite votre agent de santé."
  out_ask: "Vous n'étiez pas sûre pour un signe. Parlez aujourd'hui à votre agent de santé communautaire ou à votre sage-femme."
  out_none: "Aucun des signes de danger de la liste aujourd'hui. Les problèmes peuvent arriver sans prévenir, alors si vous êtes inquiète, parlez à votre agent de santé communautaire ou à votre sage-femme."
  pp_bleeding_l: "Saignement trop abondant après l'accouchement"
  pp_bleeding_t: "Un saignement trop abondant après l'accouchement est un signe de danger pour la mère. Allez tout de suite à l'hôpital."
  pp_bleeding_a: "Maman : depuis la dernière fois, est-ce que vous avez saigné trop abondamment ?"
  pp_fever_l: "Forte fièvre dans le mois qui suit l'accouchement"
  pp_fever_t: "Une forte fièvre dans le mois qui suit l'accouchement est un signe de danger pour la mère. Allez tout de suite à l'hôpital."
  pp_fever_a: "Maman : depuis la dernière fois, est-ce que vous avez eu une forte fièvre ?"
  pp_fits_l: "Convulsions"
  pp_fits_t: "Les convulsions sont un signe de danger pour la mère. Allez tout de suite à l'hôpital."
  pp_fits_a: "Maman : depuis la dernière fois, est-ce que vous avez eu une crise de convulsions ?"
  pp_headache_l: "Fort mal de tête avec la vue trouble"
  pp_headache_t: "Un fort mal de tête avec la vue trouble est un signe de danger pour la mère. Allez tout de suite à l'hôpital."
  pp_headache_a: "Maman : depuis la dernière fois, est-ce que vous avez eu un fort mal de tête avec la vue trouble ?"
  pp_breathing_l: "Respiration rapide ou difficile"
  pp_breathing_t: "Une respiration rapide ou difficile est un signe de danger pour la mère. Allez tout de suite à l'hôpital."
  pp_breathing_a: "Maman : depuis la dernière fois, est-ce que votre respiration a été rapide ou difficile ?"
  pp_calf_l: "Douleur, rougeur ou enflure au mollet, ou douleur à la poitrine"
  pp_calf_t: "Une douleur, une rougeur ou une enflure au mollet, ou une douleur à la poitrine, est un signe de danger pour la mère. Allez tout de suite à l'hôpital."
  pp_calf_a: "Maman : depuis la dernière fois, est-ce que vous avez eu une douleur, une rougeur ou une enflure au mollet, ou une douleur à la poitrine ?"
  nb_feed_l: "Le bébé n'arrive pas à téter"
  nb_feed_t: "Un bébé qui n'arrive pas à téter est en danger. Contactez tout de suite votre agent de santé."
  nb_feed_a: "Bébé : est-ce que le bébé n'arrive pas à téter ?"
  nb_fits_l: "Le bébé a des convulsions"
  nb_fits_t: "Les convulsions chez le bébé sont un signe de danger. Contactez tout de suite votre agent de santé."
  nb_fits_a: "Bébé : est-ce que le bébé a eu une convulsion ?"
  nb_breathing_l: "Le bébé respire vite"
  nb_breathing_t: "Une respiration rapide chez le bébé, plus de 60 respirations par minute, est un signe de danger. Contactez tout de suite votre agent de santé."
  nb_breathing_a: "Bébé : est-ce que le bébé respire vite ?"
  nb_chest_l: "La poitrine du bébé se creuse quand il respire"
  nb_chest_t: "Un tirage fort, quand la poitrine du bébé se creuse à chaque respiration, est un signe de danger. Contactez tout de suite votre agent de santé."
  nb_chest_a: "Bébé : est-ce que la poitrine du bébé se creuse fort à chaque respiration ?"
  nb_hot_l: "Le bébé est chaud quand on le touche"
  nb_hot_t: "Un bébé qui est chaud quand on le touche est en danger. Contactez tout de suite votre agent de santé."
  nb_hot_a: "Bébé : est-ce que le bébé est chaud quand on le touche ?"
  nb_cold_l: "Le bébé est froid quand on le touche"
  nb_cold_t: "Un bébé qui est froid quand on le touche est en danger. Contactez tout de suite votre agent de santé."
  nb_cold_a: "Bébé : est-ce que le bébé est froid quand on le touche ?"
  nb_movement_l: "Le bébé bouge seulement quand on le touche, ou pas du tout"
  nb_movement_t: "Un bébé qui bouge seulement quand on le stimule, ou qui ne bouge pas du tout, est en danger. Contactez tout de suite votre agent de santé."
  nb_movement_a: "Bébé : est-ce que le bébé bouge seulement quand on le touche, ou ne bouge pas du tout ?"
  nb_yellow_l: "Les paumes des mains et les plantes des pieds du bébé sont jaunes"
  nb_yellow_t: "Une peau jaune le premier jour, ou des paumes des mains et des plantes des pieds jaunes à n'importe quel âge, est un signe de danger chez le bébé. Contactez tout de suite votre agent de santé."
  nb_yellow_a: "Bébé : est-ce que les paumes des mains ou les plantes des pieds du bébé sont jaunes, ou est-ce que la peau était jaune le premier jour ?"
  bleeding_l: "Saignement pendant la grossesse"
  bleeding_t: "Un saignement pendant la grossesse est un signe de danger. Allez tout de suite à l'hôpital."
  bleeding_a: "Depuis la dernière fois, est-ce que vous avez saigné ?"
  breathless_l: "Anémie grave, avec ou sans essoufflement"
  breathless_t: "Une anémie grave, c'est-à-dire très peu de sang, avec ou sans essoufflement, est un signe de danger. Allez tout de suite à l'hôpital."
  breathless_a: "Depuis la dernière fois, est-ce que vous avez été essoufflée, ou est-ce qu'un agent de santé vous a dit que vous manquez beaucoup de sang ?"
  fever_l: "Forte fièvre"
  fever_t: "Une forte fièvre pendant la grossesse est un signe de danger. Allez tout de suite à l'hôpital."
  fever_a: "Depuis la dernière fois, est-ce que vous avez eu une forte fièvre ?"
  headache_l: "Mal de tête et vue trouble"
  headache_t: "Le mal de tête et la vue trouble sont des signes de danger. Allez tout de suite à l'hôpital."
  headache_a: "Depuis la dernière fois, est-ce que vous avez eu mal à la tête, ou est-ce que votre vue a été trouble ?"
  fits_l: "Convulsions"
  fits_t: "Les convulsions sont un signe de danger. Allez tout de suite à l'hôpital."
  fits_a: "Depuis la dernière fois, est-ce que vous avez eu une crise de convulsions ?"
  swelling_l: "Enflure de tout le corps"
  swelling_t: "Une enflure de tout le corps est un signe de danger. Allez tout de suite à l'hôpital."
  swelling_a: "Depuis la dernière fois, est-ce que tout votre corps a été enflé ?"
  early_pains_l: "Douleurs de l'accouchement avant terme"
  early_pains_t: "Les douleurs de l'accouchement avant terme, avant 37 semaines, sont un signe de danger. Allez tout de suite à l'hôpital."
  early_pains_a: "Depuis la dernière fois, est-ce que vous avez eu les douleurs de l'accouchement alors que ce n'est pas encore le moment de la naissance ?"
  movement_l: "Le bébé bouge moins"
  movement_t: "Le bébé qui bouge moins qu'avant est un signe de danger. Allez tout de suite à l'hôpital."
  movement_a: "Depuis la dernière fois, est-ce que le bébé bouge moins qu'avant ?"
  waters_l: "La poche des eaux se rompt sans douleurs de l'accouchement"
  waters_t: "La rupture de la poche des eaux sans douleurs de l'accouchement est un signe de danger. Allez tout de suite à l'hôpital."
  waters_a: "Depuis la dernière fois, est-ce que votre poche des eaux s'est rompue, ou est-ce que de l'eau a coulé, sans douleurs de l'accouchement ?"
  long_labour_l: "Douleurs de l'accouchement pendant plus de 12 heures"
  long_labour_t: "Au moment de l'accouchement : des douleurs de l'accouchement pendant plus de 12 heures sont un signe de danger. Allez tout de suite à l'hôpital."
  long_labour_a: "Est-ce que les douleurs de l'accouchement durent depuis plus de 12 heures ?"
  birth_bleeding_l: "Saignement trop abondant pendant l'accouchement"
  birth_bleeding_t: "Au moment de l'accouchement : un saignement trop abondant pendant ou après l'accouchement est un signe de danger. Allez tout de suite à l'hôpital."
  birth_bleeding_a: "Est-ce qu'il y a un saignement trop abondant pendant l'accouchement ?"
  pp_breast_l: "Seins ou bouts de sein enflés, rouges ou douloureux"
  pp_breast_t: "Vos seins ou vos bouts de sein sont enflés, rouges ou douloureux."
  pp_breast_a: "Maman : est-ce que vos seins ou vos bouts de sein sont enflés, rouges ou douloureux ?"
  pp_urine_l: "Difficulté à uriner, ou fuites d'urine"
  pp_urine_t: "Vous avez des difficultés à uriner, ou l'urine coule toute seule."
  pp_urine_a: "Maman : est-ce que vous avez des difficultés à uriner, ou est-ce que l'urine coule toute seule ?"
  pp_wound_l: "Plus de douleur ou infection à l'endroit de la déchirure ou des points"
  pp_wound_t: "Il y a plus de douleur ou une infection à l'endroit où vous avez été déchirée ou recousue."
  pp_wound_a: "Maman : est-ce qu'il y a plus de douleur, ou une infection, à l'endroit où vous avez été déchirée ou recousue ?"
  pp_discharge_l: "Pertes qui sentent mauvais"
  pp_discharge_t: "Vous avez des pertes vaginales qui sentent mauvais."
  pp_discharge_a: "Maman : est-ce que vous avez des pertes vaginales qui sentent mauvais ?"
  nb_eyes_l: "Du pus sort des yeux du bébé"
  nb_eyes_t: "Du pus sort des yeux du bébé."
  nb_eyes_a: "Bébé : est-ce que du pus sort des yeux du bébé ?"
  nb_cord_l: "Le cordon du bébé a du pus ou du sang"
  nb_cord_t: "Le cordon du bébé est irrité, avec du pus ou du sang."
  nb_cord_a: "Bébé : est-ce que le cordon est irrité, avec du pus ou du sang ?"
  nb_mouth_l: "Plaques blanches ou plaies dans la bouche du bébé"
  nb_mouth_t: "Le bébé a des plaies ou des plaques blanches dans la bouche."
  nb_mouth_a: "Bébé : est-ce qu'il y a des plaies ou des plaques blanches dans la bouche du bébé ?"
  out_mother_soon: "Maman, allez au centre de santé le plus tôt possible. Prévenez aujourd'hui votre agent de santé communautaire ou votre sage-femme."
  out_newborn_soon: "Amenez le bébé au centre de santé le plus tôt possible. Prévenez aujourd'hui votre agent de santé communautaire ou votre sage-femme."
