  tc_register: "Zuwa awon ciki akai-akai wajibi ne a lokacin ciki. Ki yi rajista a cibiyar lafiya a cikin watanni uku na farko."
  tc_bp: "A auna hawan jininki, a gwada jininki da fitsarinki a kowane zuwa."
  tc_tt: "Ki karɓi allurar T.T. guda biyu: ta farko idan an tabbatar da ciki, ta biyu bayan wata 1."
  tc_iron: "Ki sha ƙwaya ɗaya ta iron folic acid a rana, na aƙalla wata 6, bayan watanni uku na farko. Ki sha aƙalla ƙwayoyi 180."
  tc_calcium: "Ki sha ƙwayoyi biyu na calcium a rana, na aƙalla wata 6, bayan watanni uku na farko."
  tc_rest: "Ki huta aƙalla awa biyu da rana, ban da hutun awa 8 da dare."
  tc_salt: "Ki yi amfani da gishiri mai sinadarin iodine kawai. Ki karɓi ƙarin abinci mai gina jiki daga cibiyar Anganwadi akai-akai."
  tc_prepare: "Ki zaɓi asibitin tun da wuri. Ki shirya abin hawa tun da wuri. Ki zauna awa 48 a asibiti bayan haihuwa."
  tc_family: "Idan kin ga wata alamar haɗari, ki gaya wa iyalinki nan da nan."
  tf_warning: "Kowace mace za ta iya samun matsala a lokacin ciki. Ga wasu mata, tana zuwa ba tare da gargaɗi ba. Shi ya sa kike koyon alamomin haɗari."
  tf_inform: "Ma'aikaciyar lafiya ta unguwarki ita ce mutum na farko da za ki tuntuɓa don kowane aiki ko bayani a lokacin ciki."
  tf_husband: "Ya kamata mijinki ya raka ki zuwa awon ciki, ya koyi alamomin haɗari, kuma ya san lambobin gaggawa, har da ta motar asibiti."
  ta_tablet: "Ki sha jar ƙwaya ɗaya ta iron folic acid kowace rana har kwana 180, tun daga wata na huɗu na ciki."
  ta_food: "Ki ci abinci mai yawan sinadarin iron da ake samu a wurinku, tare da vitamin C, wanda ke taimaka wa jiki ya karɓi iron ɗin."
  ta_after: "Bayan haihuwa, ki ci gaba da shan jar ƙwaya ɗaya ta iron folic acid kowace rana har kwana 180."
  td_test: "Ana yin gwajin sukari a awon ciki na farko. Idan ya yi daidai, ana maimaita shi tsakanin mako 24 da 28. Za ki sha glucose a cikin ruwa, ki jira awa 2 kafin gwajin."
  td_walk: "Idan kina da ciwon sukari a lokacin ciki, ki yi tafiya ko motsa jiki na minti 30 a rana, ki bi tsarin abincin da ma'aikaciyar jinya ta ba ki."
  td_food: "Kada ki rage abincinki sosai. Cin abinci kaɗan ƙwarai zai iya cutar da girman jariri."
  td_after: "Sukari yakan koma daidai bayan haihuwa. Ya kamata ungozoma ta sake gwada sukarinki mako 6 bayan haihuwa. Ki nemi wannan gwajin."
  te_free: "A asibitin gwamnati haihuwarki kyauta ce kuma ba a karɓar kuɗi, har da tiyatar haihuwa, magunguna, gwaje-gwaje, jini, da abinci a lokacin zamanki."
  te_transport: "Abin hawa kyauta ne daga gida zuwa cibiyar lafiya, tsakanin cibiyoyi idan an tura ki, da komawa gida."
  te_jsy: "A ƙarƙashin Janani Suraksha Yojana, uwar da ta cancanta tana samun tallafin kuɗi idan ta haihu a cibiyar lafiya ta gwamnati. Ki nemi ma'aikaciyar lafiya ta unguwarki ta yi miki rajista."
  te_baby: "Ga jariri mara lafiya, har shekara ɗaya bayan haihuwa, magani, magunguna, gwaje-gwaje da abin hawa kyauta ne."
  tb_visits: "Bayan haihuwa, ana duba uwa da jariri a rana ta 1, rana ta 3, rana ta 7 da kuma a mako 6."
  tb_asha: "Ma'aikaciyar lafiya ta unguwarki tana ziyartar ki da jariri a gida a rana ta 3, 7, 14, 21, 28 da 42 bayan haihuwa."
  tb_tablets: "Ki sha ƙwaya ɗaya ta iron folic acid da ƙwayoyi biyu na calcium a rana, na aƙalla wata 6 bayan haihuwa."
  tb_pad: "Ki yi amfani da audugar mata mai tsabta don hana kamuwa da cuta."
  tb_warm: "Ki sa jariri ya ji ɗumi. Kada ki yi wa jariri wanka a awa 48 na farko. Ki bar cibiyar a bushe."
  tb_milk: "Ki ba jariri nonon uwa kawai."
  tb_sick: "Ki nisantar da jariri daga marasa lafiya."
  tb_someone: "A koyaushe wani ya kasance kusa da uwa na aƙalla awa 24 bayan haihuwa."
