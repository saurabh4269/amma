translations:
  q_checkups_l: "मला किती तपासण्या करायच्या आहेत?"
  q_checkups_a: "पहिल्या तीन महिन्यांत आरोग्य केंद्रात नोंदणी करा. नोंदणीनंतर किमान 3 प्रसूतीपूर्व तपासण्या करा. प्रत्येक वेळी रक्तदाब, रक्त आणि लघवी तपासून घ्या."
  q_iron_l: "लोहाच्या गोळ्या कशा घ्यायच्या?"
  q_iron_a: "पहिल्या तीन महिन्यांनंतर, किमान 6 महिने रोज आयर्न फॉलिक ॲसिडची एक गोळी घ्या. किमान 180 गोळ्या घ्या."
  q_calcium_l: "कॅल्शियमच्या गोळ्या कशा घ्यायच्या?"
  q_calcium_a: "पहिल्या तीन महिन्यांनंतर, किमान 6 महिने रोज कॅल्शियमच्या दोन गोळ्या घ्या."
  q_rest_l: "मी किती विश्रांती घ्यावी?"
  q_rest_a: "दिवसा किमान दोन तास विश्रांती घ्या, आणि रात्री 8 तास."
  q_weight_l: "माझे वजन किती वाढायला हवे?"
  q_weight_a: "प्रत्येक तपासणीत वजन करून घ्या. गरोदरपणात किमान 9 ते 11 किलो वजन वाढायला हवे, आणि शेवटच्या 6 महिन्यांत दर महिन्याला किमान 1 किलो."
  q_cost_l: "प्रसूतीसाठी पैसे द्यावे लागतील का?"
  q_cost_a: "सरकारी रुग्णालयात, जननी शिशु सुरक्षा कार्यक्रमाअंतर्गत, प्रसूती मोफत आहे. सिझेरियन, औषधे, तपासण्या, रक्त आणि दाखल असतानाचे जेवणही मोफत आहे."
  q_ride_l: "रुग्णालयात जायच्या वाहनासाठी पैसे द्यावे लागतील का?"
  q_ride_a: "घरापासून आरोग्य संस्थेपर्यंत, पुढे पाठवल्यास एका संस्थेतून दुसऱ्या संस्थेत, आणि परत घरी, वाहतूक मोफत आहे."
  q_doctor_day_l: "डॉक्टर माझी तपासणी कधी करू शकतात?"
  q_doctor_day_a: "गरोदरपणाच्या दुसऱ्या किंवा तिसऱ्या तिमाहीत, महिन्याच्या 9 तारखेला डॉक्टरांकडून किमान एक प्रसूतीपूर्व तपासणी करून घ्या."
  q_where_birth_l: "प्रसूती कुठे करावी?"
  q_where_birth_a: "प्रसूती आरोग्य संस्थेत प्रशिक्षित व्यक्तीकडून करणे योग्य आहे. रुग्णालय आधीच ठरवा आणि वाहनाची सोय आधीच करा. प्रसूतीनंतर 48 तास रुग्णालयात थांबा."
  q_first_feed_l: "स्तनपान कधी सुरू करू?"
  q_first_feed_a: "जन्मानंतर 1 तासाच्या आत स्तनपान सुरू करा."
  q_baby_food_l: "बाळाला काय पाजू?"
  q_baby_food_a: "बाळाला फक्त आईचे दूध पाजा. लवकर स्तनपान सुरू केल्याने आई 6 महिने फक्त स्वतःचे दूध पाजू शकते."
  q_baby_bath_l: "बाळाला अंघोळ कधी घालू शकते?"
  q_baby_bath_a: "पहिले 48 तास बाळाला अंघोळ घालू नका. बाळाला उबदार ठेवा."
  q_cord_l: "नाळेची काळजी कशी घेऊ?"
  q_cord_a: "नाळ कोरडी ठेवा."
  q_small_baby_l: "माझे बाळ खूप लहान आहे. काय करू?"
  q_small_baby_a: "जन्माच्या वेळी 2.5 किलोपेक्षा कमी वजनाच्या बाळाला विशेष काळजी लागते. बाळ 2 किलोपेक्षा कमी असेल, तर स्तनपान चालू ठेवण्यासाठी आणि कांगारू मदर केअरसाठी ए.एन.एम. ताईंशी संपर्क साधा."

  tc_register: "गरोदरपणात नियमित तपासणी आवश्यक आहे. पहिल्या तीन महिन्यांत आरोग्य केंद्रात नोंदणी करा."
  tc_bp: "प्रत्येक तपासणीत रक्तदाब, रक्त आणि लघवी तपासून घ्या."
  tc_tt: "टी.टी.ची दोन इंजेक्शने घ्या: पहिले गरोदरपण निश्चित झाल्यावर आणि दुसरे 1 महिन्यानंतर."
  tc_iron: "पहिल्या तीन महिन्यांनंतर, किमान 6 महिने रोज आयर्न फॉलिक ॲसिडची एक गोळी घ्या. किमान 180 गोळ्या घ्या."
  tc_calcium: "पहिल्या तीन महिन्यांनंतर, किमान 6 महिने रोज कॅल्शियमच्या दोन गोळ्या घ्या."
  tc_rest: "दिवसा किमान दोन तास विश्रांती घ्या, आणि रात्री 8 तास."
  tc_salt: "फक्त आयोडीनयुक्त मीठ वापरा. अंगणवाडी केंद्रातून मिळणारा पूरक पोषण आहार नियमित घ्या."
  tc_prepare: "रुग्णालय आधीच ठरवा. वाहनाची सोय आधीच करा. प्रसूतीनंतर 48 तास रुग्णालयात थांबा."
  tc_family: "धोक्याचे कोणतेही लक्षण दिसले, तर ताबडतोब कुटुंबातील लोकांना सांगा."
  tf_warning: "गरोदरपणात कोणत्याही स्त्रीला त्रास होऊ शकतो. काही स्त्रियांना तो पूर्वसूचनेशिवाय होतो. म्हणूनच तुम्ही धोक्याची लक्षणे शिकत आहात."
  tf_inform: "गरोदरपणात कोणत्याही सेवेसाठी किंवा माहितीसाठी सर्वात आधी तुमच्या आशा ताईंशी संपर्क साधा."
  tf_husband: "तुमच्या पतीने तपासणीला तुमच्यासोबत यावे, धोक्याची लक्षणे समजून घ्यावीत, आणि आणीबाणीचे नंबर, रुग्णवाहिकेचा नंबरही, त्यांना माहीत असावेत."
  ta_tablet: "गरोदरपणाच्या चौथ्या महिन्यापासून, 180 दिवस रोज आयर्न फॉलिक ॲसिडची एक लाल गोळी घ्या."
  ta_food: "जवळपास मिळणारे लोहयुक्त पदार्थ खा, व्हिटॅमिन सी सोबत, ज्यामुळे शरीर लोह चांगले शोषून घेते."
  ta_after: "प्रसूतीनंतरही, 180 दिवस रोज आयर्न फॉलिक ॲसिडची एक लाल गोळी घेत राहा."
  td_test: "साखरेची तपासणी पहिल्या तपासणीच्या वेळी होते. ती सामान्य असेल, तर 24 ते 28 आठवड्यांदरम्यान पुन्हा होते. तुम्हाला पाण्यात विरघळवलेले ग्लुकोज प्यावे लागते आणि तपासणीसाठी 2 तास थांबावे लागते."
  td_walk: "गरोदरपणात साखर असल्यास रोज 30 मिनिटे चाला किंवा व्यायाम करा, आणि नर्सने सांगितलेला आहार पाळा."
  td_food: "जेवण खूप जास्त कमी करू नका. खूप कमी खाल्ल्याने बाळाच्या वाढीला हानी होऊ शकते."
  td_after: "प्रसूतीनंतर साखर सहसा सामान्य होते. ए.एन.एम. ताईंनी प्रसूतीनंतर 6 आठवड्यांनी तुमची साखर पुन्हा तपासायला हवी. ही तपासणी नक्की करून घ्या."
  te_free: "सरकारी रुग्णालयात तुमची प्रसूती मोफत आहे. सिझेरियन, औषधे, तपासण्या, रक्त आणि दाखल असतानाचे जेवणही मोफत आहे."
  te_transport: "घरापासून आरोग्य संस्थेपर्यंत, पुढे पाठवल्यास एका संस्थेतून दुसऱ्या संस्थेत, आणि परत घरी, वाहतूक मोफत आहे."
  te_jsy: "जननी सुरक्षा योजनेत, पात्र मातेला सरकारी आरोग्य संस्थेत प्रसूती केल्यास रोख मदत मिळते. तुमच्या आशा ताईंना नोंदणी करायला सांगा."
  te_baby: "आजारी बाळासाठी, जन्मानंतर एक वर्षापर्यंत, उपचार, औषधे, तपासण्या आणि वाहतूक मोफत आहे."
  tb_visits: "प्रसूतीनंतर आई आणि बाळाची तपासणी पहिल्या, तिसऱ्या, सातव्या दिवशी आणि सहाव्या आठवड्यात होते."
  tb_asha: "तुमच्या आशा ताई जन्मानंतर 3, 7, 14, 21, 28 आणि 42 व्या दिवशी तुमच्याकडे आणि बाळाकडे घरी येतात."
  tb_tablets: "प्रसूतीनंतर किमान 6 महिने रोज आयर्न फॉलिक ॲसिडची एक गोळी आणि कॅल्शियमच्या दोन गोळ्या घ्या."
  tb_pad: "संसर्ग टाळण्यासाठी स्वच्छ सॅनिटरी पॅड वापरा."
  tb_warm: "बाळाला उबदार ठेवा. पहिले 48 तास बाळाला अंघोळ घालू नका. नाळ कोरडी ठेवा."
  tb_milk: "बाळाला फक्त आईचे दूध पाजा."
  tb_sick: "बाळाला आजारी माणसांपासून दूर ठेवा."
  tb_someone: "प्रसूतीनंतर किमान 24 तास आईजवळ नेहमी कोणीतरी असावे."
