translations:
  bleeding_l: "गरोदरपणात रक्तस्राव"
  bleeding_t: "गरोदरपणात रक्तस्राव होणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  bleeding_a: "मागच्या वेळेपासून, तुम्हाला रक्तस्राव झाला आहे का?"
  breathless_l: "रक्ताची तीव्र कमतरता, दम लागण्यासह किंवा त्याशिवाय"
  breathless_t: "रक्ताची तीव्र कमतरता, दम लागण्यासह किंवा त्याशिवाय, हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  breathless_a: "मागच्या वेळेपासून, तुम्हाला दम लागला आहे का, किंवा आरोग्य कर्मचाऱ्याने तुमचे रक्त खूप कमी आहे असे सांगितले आहे का?"
  fever_l: "तीव्र ताप"
  fever_t: "गरोदरपणात तीव्र ताप येणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  fever_a: "मागच्या वेळेपासून, तुम्हाला तीव्र ताप आला आहे का?"
  headache_l: "डोकेदुखी आणि अंधुक दिसणे"
  headache_t: "डोकेदुखी आणि अंधुक दिसणे ही धोक्याची लक्षणे आहेत. ताबडतोब रुग्णालयात जा."
  headache_a: "मागच्या वेळेपासून, तुमचे डोके दुखले आहे का, किंवा अंधुक दिसले आहे का?"
  fits_l: "झटके येणे"
  fits_t: "झटके येणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  fits_a: "मागच्या वेळेपासून, तुम्हाला झटका आला आहे का?"
  swelling_l: "संपूर्ण शरीरावर सूज"
  swelling_t: "संपूर्ण शरीरावर सूज येणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  swelling_a: "मागच्या वेळेपासून, तुमच्या संपूर्ण शरीरावर सूज आली आहे का?"
  early_pains_l: "वेळेआधी प्रसूती कळा"
  early_pains_t: "वेळेआधी, 37 आठवड्यांपूर्वी, प्रसूती कळा येणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  early_pains_a: "मागच्या वेळेपासून, अजून प्रसूतीची वेळ झाली नसताना तुम्हाला कळा आल्या आहेत का?"
  movement_l: "बाळाची हालचाल कमी होणे"
  movement_t: "पोटातील बाळाची हालचाल आधीपेक्षा कमी होणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  movement_a: "मागच्या वेळेपासून, बाळाची हालचाल आधीपेक्षा कमी झाली आहे का?"
  waters_l: "कळा नसताना पाण्याची पिशवी फुटणे"
  waters_t: "प्रसूती कळा नसताना पाण्याची पिशवी फुटणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  waters_a: "मागच्या वेळेपासून, कळा नसताना तुमची पाण्याची पिशवी फुटली आहे का किंवा पाणी गेले आहे का?"
  long_labour_l: "12 तासांपेक्षा जास्त प्रसूती कळा"
  long_labour_t: "प्रसूतीची वेळ आल्यावर: 12 तासांपेक्षा जास्त वेळ कळा येत राहणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  long_labour_a: "प्रसूती कळा 12 तासांपेक्षा जास्त वेळ चालू आहेत का?"
  birth_bleeding_l: "प्रसूतीच्या वेळी अति रक्तस्राव"
  birth_bleeding_t: "प्रसूतीची वेळ आल्यावर: प्रसूतीच्या वेळी किंवा नंतर खूप जास्त रक्तस्राव होणे हे धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  birth_bleeding_a: "प्रसूतीच्या वेळी खूप जास्त रक्तस्राव होत आहे का?"

  pp_bleeding_l: "प्रसूतीनंतर अति रक्तस्राव"
  pp_bleeding_t: "प्रसूतीनंतर खूप जास्त रक्तस्राव होणे हे आईसाठी धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  pp_bleeding_a: "आई: मागच्या वेळेपासून, तुम्हाला खूप जास्त रक्तस्राव झाला आहे का?"
  pp_fever_l: "प्रसूतीनंतर एका महिन्याच्या आत तीव्र ताप"
  pp_fever_t: "प्रसूतीनंतर एका महिन्याच्या आत तीव्र ताप येणे हे आईसाठी धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  pp_fever_a: "आई: मागच्या वेळेपासून, तुम्हाला तीव्र ताप आला आहे का?"
  pp_fits_l: "झटके येणे"
  pp_fits_t: "झटके येणे हे आईसाठी धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  pp_fits_a: "आई: मागच्या वेळेपासून, तुम्हाला झटका आला आहे का?"
  pp_headache_l: "तीव्र डोकेदुखीसह अंधुक दिसणे"
  pp_headache_t: "तीव्र डोकेदुखीसह अंधुक दिसणे हे आईसाठी धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  pp_headache_a: "आई: मागच्या वेळेपासून, तुम्हाला तीव्र डोकेदुखीसह अंधुक दिसले आहे का?"
  pp_breathing_l: "श्वास जलद चालणे किंवा श्वास घ्यायला त्रास"
  pp_breathing_t: "श्वास जलद चालणे किंवा श्वास घ्यायला त्रास होणे हे आईसाठी धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  pp_breathing_a: "आई: मागच्या वेळेपासून, तुमचा श्वास जलद चालला आहे का किंवा श्वास घ्यायला त्रास झाला आहे का?"
  pp_calf_l: "पोटरीत दुखणे, लाली किंवा सूज, किंवा छातीत दुखणे"
  pp_calf_t: "पोटरीत दुखणे, लाली किंवा सूज, किंवा छातीत दुखणे हे आईसाठी धोक्याचे लक्षण आहे. ताबडतोब रुग्णालयात जा."
  pp_calf_a: "आई: मागच्या वेळेपासून, तुमच्या पोटरीत दुखले, लाली किंवा सूज आली आहे का, किंवा छातीत दुखले आहे का?"

  nb_feed_l: "बाळ दूध पिऊ शकत नाही"
  nb_feed_t: "बाळ दूध पिऊ शकत नसेल तर ते धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_feed_a: "बाळ: बाळ दूध पिऊ शकत नाही का?"
  nb_fits_l: "बाळाला झटके येणे"
  nb_fits_t: "बाळाला झटके येणे हे धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_fits_a: "बाळ: बाळाला झटका आला आहे का?"
  nb_breathing_l: "बाळाचा श्वास जलद चालणे"
  nb_breathing_t: "बाळाचा श्वास मिनिटाला 60 पेक्षा जास्त वेगाने चालणे हे धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_breathing_a: "बाळ: बाळाचा श्वास जलद चालला आहे का?"
  nb_chest_l: "श्वास घेताना बाळाची छाती आत ओढली जाणे"
  nb_chest_t: "श्वास घेताना बाळाची छाती जोरात आत ओढली जाणे हे धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_chest_a: "बाळ: प्रत्येक श्वासाबरोबर बाळाची छाती जोरात आत ओढली जाते का?"
  nb_hot_l: "बाळ हाताला गरम लागणे"
  nb_hot_t: "बाळ हाताला गरम लागत असेल तर ते धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_hot_a: "बाळ: बाळ हाताला गरम लागते का?"
  nb_cold_l: "बाळ हाताला थंड लागणे"
  nb_cold_t: "बाळ हाताला थंड लागत असेल तर ते धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_cold_a: "बाळ: बाळ हाताला थंड लागते का?"
  nb_movement_l: "बाळ फक्त हलवल्यावर हालचाल करते किंवा अजिबात करत नाही"
  nb_movement_t: "बाळ फक्त हलवल्यावरच हालचाल करत असेल किंवा अजिबात हालचाल करत नसेल तर ते धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_movement_a: "बाळ: बाळ फक्त स्पर्श केल्यावर हलते का, किंवा अजिबात हलत नाही का?"
  nb_yellow_l: "बाळाचे तळहात आणि तळपाय पिवळे होणे"
  nb_yellow_t: "पहिल्या दिवशी त्वचा पिवळी होणे, किंवा कोणत्याही वयात तळहात आणि तळपाय पिवळे होणे, हे बाळासाठी धोक्याचे लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  nb_yellow_a: "बाळ: बाळाचे तळहात किंवा तळपाय पिवळे आहेत का, किंवा पहिल्या दिवशी त्वचा पिवळी होती का?"

  out_preg_urgent: "तुम्हाला धोक्याचे एक लक्षण आहे. ताबडतोब जवळच्या योग्य रुग्णालयात जा. आत्ताच कुटुंबाला सांगा."
  out_mother_urgent: "आई, तुम्हाला धोक्याचे एक लक्षण आहे. ताबडतोब रुग्णालयात जा. आत्ताच कुटुंबाला सांगा."
  out_newborn_urgent: "बाळाला धोक्याचे एक लक्षण आहे. ताबडतोब आरोग्य कर्मचाऱ्याशी संपर्क साधा."
  out_ask: "एका लक्षणाबद्दल तुम्हाला खात्री नव्हती. आजच तुमच्या आशा किंवा ए.एन.एम. ताईंशी बोला."
  out_none: "आज सांगितलेल्या धोक्याच्या लक्षणांपैकी एकही नाही. त्रास पूर्वसूचनेशिवायही येऊ शकतो, म्हणून काळजी वाटली तर तुमच्या आशा किंवा ए.एन.एम. ताईंशी बोला."
