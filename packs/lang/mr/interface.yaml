translations:
  p_recall_ask: "कोणती लक्षणे दिसली की तुम्हाला ताबडतोब रुग्णालयात जायला हवे? एक सांगा."
  p_recall_more: "आणखी एखादे आहे का?"
  p_recall_missed: "ही धोक्याची ती लक्षणे आहेत जी तुम्ही या वेळी सांगितली नाहीत."
  p_recall_all: "तुम्हाला सगळी आठवली."
  p_check_intro: "आता मी प्रत्येक लक्षणाबद्दल विचारते. हो, नाही, किंवा खात्री नाही असे उत्तर द्या."
  p_open_ask: "तुम्हाला काही विचारायचे आहे का, किंवा काही ठीक वाटत नाही का?"
  p_open_more: "आणखी काही?"
  p_did_you_say: "तुम्ही हे म्हणालात का:"
  p_not_sure: "याबद्दल मला खात्री नाही. कृपया कोणाला तरी विचारा: तुमच्या आशा, ए.एन.एम. किंवा डॉक्टरांना."
  p_noted: "मी हे क्लिनिकसाठी तुमच्या कार्डावर लिहिले आहे. यातून मी विचारते त्या धोक्याच्या लक्षणांपैकी काही निघाले नाही, पण हे काय आहे ते मी सांगू शकत नाही. कृपया हे कार्ड तुमच्या आशा, ए.एन.एम. किंवा डॉक्टरांना दाखवा."
  o_back: "पाठीत"
  p_yes: "हो"
  p_no: "नाही"
  p_unsure: "खात्री नाही"
  p_done: "एवढेच"
  p_plan_intro: "आधी, आणीबाणीसाठी तुमची योजना करूया. हे कुटुंबासोबत बसून करा."
  p_plan_playback: "ही तुमची योजना आहे. धोक्याचे लक्षण दिसले तर या लोकांना फोन करा आणि या ठिकाणी जा."
  p_clarify_summary: "मी परत सांगते. हे बरोबर आहे का?"
  p_track_intro: "या आठवड्यात जाणून घ्यायची एक गोष्ट."

  s_decider_ask: "रुग्णालयात जायची वेळ आली, तर कुटुंबात तुमच्यासोबत निर्णय कोण घेते? नाव आणि फोन नंबर सांगा."
  s_decider: "माझ्यासोबत निर्णय घेतात"
  s_escort_ask: "तुमच्यासोबत रुग्णालयात कोण येईल?"
  s_escort: "माझ्यासोबत येतील"
  s_worker_ask: "तुमच्या आशा किंवा ए.एन.एम. ताई कोण आहेत? नाव आणि फोन नंबर सांगा."
  s_worker: "माझ्या आशा किंवा ए.एन.एम. ताई"
  s_facility_ask: "तुम्ही कोणत्या रुग्णालयात जाणार? आत्ताच कुटुंबासोबत ठरवा."
  s_facility: "रुग्णालय"
  s_transport_ask: "तुम्ही तिथे कसे पोहोचणार? गाडीवाल्याचे किंवा रुग्णवाहिकेचे नाव आणि नंबर सांगा."
  s_transport: "वाहन"
  s_money_ask: "कुटुंबाने आणीबाणीसाठी काही पैसे बाजूला ठेवले आहेत का?"
  s_money: "बाजूला ठेवलेले पैसे"

