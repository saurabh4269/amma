# Drafts, like the rest of this folder. Not yet read by a Marathi speaker or a clinician.
translations:
  t_family_planning: "पुढच्या बाळात अंतर"
  t_immunisation: "बाळाच्या लसी"
  tfp_spacing: "दोन मुलांमध्ये 3 वर्षांचे अंतर ठेवणे आई आणि बाळ दोघांच्या आरोग्यासाठी चांगले आहे."
  tfp_fertility: "बाळंतपणानंतर, पाळी परत येण्याआधीही तुम्हाला पुन्हा दिवस जाऊ शकतात."
  tfp_methods: "कुटुंब नियोजन कार्यक्रमात मिळणारे अंतर ठेवण्याचे कोणतेही साधन तुम्ही निवडू शकता, जसे आय.यू.सी.डी., इंजेक्शन, गोळ्या किंवा निरोध."
  tfp_iucd: "आय.यू.सी.डी. प्रसूतीनंतर 48 तासांच्या आत, किंवा प्रसूतीनंतर 6 आठवड्यांनी बसवता येते."
  tfp_complete: "तुमचे कुटुंब पूर्ण झाले असेल, तर तुम्ही किंवा तुमचे पती गर्भनिरोधाचे कायमचे साधन निवडू शकता."
  tfp_free: "सर्व सरकारी आरोग्य संस्थांमध्ये गर्भनिरोधाच्या सर्व सेवा मोफत आहेत."
  tim_birth: "जन्माच्या वेळी बाळाला बी.सी.जी., ओ.पी.व्ही. आणि हिपॅटायटिस बी ची लस दिली जाते. हिपॅटायटिस बी ची लस जन्मानंतर 24 तासांच्या आत द्यायला हवी."
  tim_visits: "दीड महिना, अडीच महिने, साडेतीन महिने आणि 9 महिने या वयात बाळाला जवळच्या लसीकरण सत्रात किंवा आरोग्य केंद्रात न्या, म्हणजे देय असलेल्या सर्व लसी मिळतील."
  tim_m1: "दीड महिन्याला कार्डावर या लसी लिहिल्या आहेत: ओ.पी.व्ही.-1, पेंटा-1, रोटा-1, पी.सी.व्ही.-1 आणि आय.पी.व्ही.-1."
  tim_m2: "अडीच महिन्यांना कार्डावर या लसी लिहिल्या आहेत: ओ.पी.व्ही.-2, पेंटा-2 आणि रोटा-2."
  tim_m3: "साडेतीन महिन्यांना कार्डावर या लसी लिहिल्या आहेत: ओ.पी.व्ही.-3, पेंटा-3, रोटा-3, पी.सी.व्ही.-2 आणि आय.पी.व्ही.-2."
  tim_states: "तीन लसी फक्त काही राज्यांत आणि जिल्ह्यांत मिळतात: जे.ई., पी.सी.व्ही. आणि रोटाव्हायरस."
  tim_keep: "लसीकरण कार्ड जपून ठेवा आणि पुढच्या वेळी सोबत आणा."
  q_birth_vaccines_l: "जन्माच्या वेळी बाळाला कोणत्या लसी देतात?"
  q_birth_vaccines_a: "जन्माच्या वेळी बाळाला बी.सी.जी., ओ.पी.व्ही. आणि हिपॅटायटिस बी ची लस दिली जाते. हिपॅटायटिस बी ची लस जन्मानंतर 24 तासांच्या आत द्यायला हवी."
  q_next_vaccines_l: "बाळाच्या पुढच्या लसी कधी आहेत?"
  q_next_vaccines_a: "दीड महिना, अडीच महिने, साडेतीन महिने आणि 9 महिने या वयात बाळाला जवळच्या लसीकरण सत्रात किंवा आरोग्य केंद्रात न्या. लसीकरण कार्ड जपून ठेवा आणि सोबत आणा."
  q_spacing_l: "पुढच्या बाळासाठी किती थांबावे?"
  q_spacing_a: "दोन मुलांमध्ये 3 वर्षांचे अंतर ठेवणे आई आणि बाळ दोघांच्या आरोग्यासाठी चांगले आहे."
  q_fp_methods_l: "पुढचे गरोदरपण कसे लांबवू?"
  q_fp_methods_a: "कुटुंब नियोजन कार्यक्रमात मिळणारे अंतर ठेवण्याचे कोणतेही साधन तुम्ही निवडू शकता, जसे आय.यू.सी.डी., इंजेक्शन, गोळ्या किंवा निरोध. कुटुंब पूर्ण झाले असेल, तर तुम्ही किंवा तुमचे पती कायमचे साधन निवडू शकता."
  q_solid_food_l: "बाळाला वरचे अन्न कधी सुरू करू?"
  q_solid_food_a: "स्तनपान चालू ठेवा. 6 महिने पूर्ण झाल्यावर बाळाला 2 ते 3 मोठे चमचे मऊ, चांगले कुस्करलेले अन्न, दिवसातून 2 ते 3 वेळा द्यायला सुरू करा."
  q_hand_wash_l: "हात कधी धुवावेत?"
  q_hand_wash_a: "अन्न शिजवण्याआधी, बाळाला भरवण्याआधी, शौचानंतर आणि बाळाची शी साफ केल्यानंतर दोन्ही हात साबणाने धुवा."
