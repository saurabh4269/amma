  headache_l: "Kichwa kuuma na kuona ukungu"
  headache_t: "Kichwa kuuma na kuona ukungu ni dalili za hatari. Nenda hospitali mara moja."
  headache_a: "Tangu mara ya mwisho, kichwa kimekuuma, au umekuwa ukiona ukungu?"
  fits_l: "Degedege"
  fits_t: "Degedege ni dalili ya hatari. Nenda hospitali mara moja."
  fits_a: "Tangu mara ya mwisho, umepata degedege?"
  swelling_l: "Kuvimba mwili mzima"
