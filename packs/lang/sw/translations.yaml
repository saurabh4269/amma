  q_fp_methods_l: "Nawezaje kuchelewesha mimba ijayo?"
  q_fp_methods_a: "Unaweza kuchagua njia yoyote ya kupanga uzazi inayotolewa na Mpango wa Uzazi wa Mpango, kama kitanzi, sindano, vidonge au kondomu. Kama familia yenu imekamilika, wewe au mume wako mnaweza kuchagua njia ya kudumu."
  q_solid_food_l: "Nianze lini kumpa mtoto chakula kingine?"
  q_solid_food_a: "Endelea kunyonyesha. Mtoto akitimiza miezi 6, anza kumpa vijiko 2 hadi 3 vikubwa vya chakula laini kilichopondwa vizuri, mara 2 hadi 3 kwa siku."
  q_hand_wash_l: "Ninawe mikono wakati gani?"
  q_hand_wash_a: "Nawa mikono yote miwili kwa sabuni kabla ya kuandaa chakula, kabla ya kumlisha mtoto, baada ya kwenda haja kubwa na baada ya kusafisha kinyesi cha mtoto."
  s_decider_ask: "Ni nani katika familia anayeamua pamoja nawe unapohitaji kwenda hospitali? Taja jina na namba ya simu."
