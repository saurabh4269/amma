  nb_hot_l: "Mtoto ana joto ukimgusa"
  nb_hot_t: "Mtoto mwenye joto ukimgusa yuko hatarini. Wasiliana na mhudumu wako wa afya mara moja."
  nb_hot_a: "Mtoto: je, mtoto ana joto ukimgusa?"
  nb_cold_l: "Mtoto ni baridi ukimgusa"
  nb_cold_t: "Mtoto aliye baridi ukimgusa yuko hatarini. Wasiliana na mhudumu wako wa afya mara moja."
  nb_cold_a: "Mtoto: je, mtoto ni baridi ukimgusa?"
  nb_movement_l: "Mtoto anajisogeza tu akiguswa, au hajisogezi kabisa"
  nb_movement_t: "Mtoto anayejisogeza tu akishtuliwa, au asiyejisogeza kabisa, yuko hatarini. Wasiliana na mhudumu wako wa afya mara moja."
  nb_movement_a: "Mtoto: je, mtoto anajisogeza tu akiguswa, au hajisogezi kabisa?"
  nb_yellow_l: "Viganja na nyayo za mtoto ni za manjano"
  nb_yellow_t: "Ngozi ya manjano siku ya kwanza, au viganja na nyayo za manjano katika umri wowote, ni dalili ya hatari kwa mtoto. Wasiliana na mhudumu wako wa afya mara moja."
  nb_yellow_a: "Mtoto: je, viganja au nyayo za mtoto ni za manjano, au ngozi ilikuwa ya manjano siku ya kwanza?"
  bleeding_l: "Kutoka damu wakati wa ujauzito"
  bleeding_t: "Kutoka damu wakati wa ujauzito ni dalili ya hatari. Nenda hospitali mara moja."
  bleeding_a: "Tangu mara ya mwisho, umetoka damu yoyote?"
  breathless_l: "Upungufu mkubwa wa damu, pamoja na kukosa pumzi au bila kukosa pumzi"
  breathless_t: "Upungufu mkubwa wa damu, yaani damu kidogo sana, pamoja na kukosa pumzi au bila kukosa pumzi, ni dalili ya hatari. Nenda hospitali mara moja."
  breathless_a: "Tangu mara ya mwisho, umekosa pumzi, au mhudumu wa afya amekuambia damu yako iko chini sana?"
  fever_l: "Homa kali"
  fever_t: "Homa kali wakati wa ujauzito ni dalili ya hatari. Nenda hospitali mara moja."
