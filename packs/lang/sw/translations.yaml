  nb_chest_l: "Kifua cha mtoto kinabonyea ndani anapopumua"
  nb_chest_t: "Kifua kubonyea ndani sana, yaani kifua cha mtoto kinapoingia ndani kila anapovuta pumzi, ni dalili ya hatari. Wasiliana na mhudumu wako wa afya mara moja."
