  tc_family: "Ukipata dalili yoyote ya hatari, waambie watu wa familia yako mara moja."
  tf_warning: "Mwanamke yeyote anaweza kupata matatizo wakati wa ujauzito. Kwa baadhi ya wanawake yanakuja bila onyo. Ndiyo sababu unajifunza dalili za hatari."
