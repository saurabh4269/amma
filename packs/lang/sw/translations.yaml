  q_checkups_l: "Ninahitaji kwenda kliniki mara ngapi?"
  q_checkups_a: "Jiandikishe kwenye kituo cha afya katika miezi mitatu ya kwanza. Hudhuria kliniki ya wajawazito angalau mara 3 baada ya kujiandikisha. Pimwa shinikizo la damu, na damu na mkojo vipimwe kila unapokwenda."
  q_iron_l: "Ninamezaje vidonge vya madini ya chuma?"
  q_iron_a: "Meza kidonge kimoja cha madini ya chuma na foliki asidi kila siku kwa angalau miezi 6 baada ya miezi mitatu ya kwanza ya ujauzito. Meza angalau vidonge 180."
  q_calcium_l: "Ninamezaje vidonge vya kalsiamu?"
  q_calcium_a: "Meza vidonge viwili vya kalsiamu kila siku kwa angalau miezi 6 baada ya miezi mitatu ya kwanza ya ujauzito."
  q_rest_l: "Nipumzike kiasi gani?"
  q_rest_a: "Pumzika angalau saa mbili mchana, pamoja na saa 8 za kupumzika usiku."
  q_weight_l: "Niongeze uzito kiasi gani?"
  q_weight_a: "Pimwa uzito kila unapokwenda kliniki. Ongeza angalau kilo 9 hadi 11 wakati wa ujauzito, na angalau kilo 1 kila mwezi katika miezi 6 ya mwisho."
  q_cost_l: "Je, ni lazima nilipie kujifungua?"
  q_cost_a: "Katika hospitali ya serikali, chini ya Janani-Shishu Suraksha Karyakram, kujifungua ni bure na hulipi pesa taslimu. Upasuaji wa kujifungua, dawa, vipimo, damu na chakula ukiwa umelazwa pia ni bure."
  q_ride_l: "Je, ni lazima nilipie usafiri wa kwenda hospitali?"
  q_ride_a: "Usafiri ni bure kutoka nyumbani hadi kituo cha afya, kati ya vituo ukipewa rufaa, na kurudi nyumbani."
  q_doctor_day_l: "Daktari anaweza kunipima lini?"
  q_doctor_day_a: "Katika miezi mitatu ya kati au ya mwisho ya ujauzito, pimwa na daktari angalau mara moja, tarehe 9 ya mwezi."
  q_where_birth_l: "Nijifungulie wapi?"
  q_where_birth_a: "Inashauriwa kujifungulia kwenye kituo cha afya chenye mhudumu mwenye ujuzi wa kuzalisha. Chagua hospitali na upange usafiri mapema. Kaa saa 48 baada ya kujifungua."
  q_first_feed_l: "Nianze kunyonyesha lini?"
  q_first_feed_a: "Anza kunyonyesha ndani ya saa 1 baada ya mtoto kuzaliwa."
  q_baby_food_l: "Nimlishe mtoto nini?"
  q_baby_food_a: "Mpe mtoto maziwa ya mama pekee. Kuanza kunyonyesha mapema humsaidia mama kunyonyesha maziwa ya mama pekee kwa miezi 6."
  q_baby_bath_l: "Naweza kumwogesha mtoto lini?"
  q_baby_bath_a: "Usimwogeshe mtoto kwa saa 48 za kwanza. Mweke mtoto katika hali ya joto."
  q_cord_l: "Ninatunzaje kitovu?"
  q_cord_a: "Kiweke kitovu kikiwa kikavu."
  q_small_baby_l: "Mtoto wangu ni mdogo sana. Nifanye nini?"
  q_small_baby_a: "Mtoto aliyezaliwa na uzito chini ya kilo 2.5 anahitaji huduma maalum. Kama mtoto ana chini ya kilo 2, wasiliana na mkunga akusaidie kunyonyesha na huduma ya kangaroo."
  out_preg_urgent: "Una dalili ya hatari. Nenda mara moja kwenye hospitali inayofaa iliyo karibu. Iambie familia yako sasa."
  out_mother_urgent: "Mama, una dalili ya hatari. Nenda hospitali mara moja. Iambie familia yako sasa."
  out_newborn_urgent: "Mtoto ana dalili ya hatari. Wasiliana na mhudumu wako wa afya mara moja."
  out_ask: "Hukuwa na uhakika kuhusu dalili moja. Ongea na mhudumu wako wa afya ya jamii au mkunga leo."
  out_none: "Leo hakuna dalili yoyote ya hatari kati ya zilizoorodheshwa. Matatizo yanaweza kuja bila onyo, kwa hiyo ukiwa na wasiwasi, ongea na mhudumu wako wa afya ya jamii au mkunga."
  pp_bleeding_l: "Kutoka damu nyingi baada ya kujifungua"
  pp_bleeding_t: "Kutoka damu nyingi baada ya kujifungua ni dalili ya hatari kwa mama. Nenda hospitali mara moja."
  pp_bleeding_a: "Mama: tangu mara ya mwisho, umetoka damu nyingi?"
  pp_fever_l: "Homa kali ndani ya mwezi mmoja baada ya kujifungua"
  pp_fever_t: "Homa kali ndani ya mwezi mmoja baada ya kujifungua ni dalili ya hatari kwa mama. Nenda hospitali mara moja."
  pp_fever_a: "Mama: tangu mara ya mwisho, umepata homa kali?"
  pp_fits_l: "Degedege"
  pp_fits_t: "Degedege ni dalili ya hatari kwa mama. Nenda hospitali mara moja."
  pp_fits_a: "Mama: tangu mara ya mwisho, umepata degedege?"
  pp_headache_l: "Kichwa kuuma sana pamoja na kuona ukungu"
  pp_headache_t: "Kichwa kuuma sana pamoja na kuona ukungu ni dalili ya hatari kwa mama. Nenda hospitali mara moja."
  pp_headache_a: "Mama: tangu mara ya mwisho, kichwa kimekuuma sana pamoja na kuona ukungu?"
  pp_breathing_l: "Kupumua haraka au kwa shida"
  pp_breathing_t: "Kupumua haraka au kwa shida ni dalili ya hatari kwa mama. Nenda hospitali mara moja."
  pp_breathing_a: "Mama: tangu mara ya mwisho, umekuwa ukipumua haraka au kwa shida?"
  pp_calf_l: "Maumivu, wekundu au uvimbe kwenye shavu la mguu, au maumivu ya kifua"
  pp_calf_t: "Maumivu, wekundu au uvimbe kwenye shavu la mguu, au maumivu ya kifua, ni dalili ya hatari kwa mama. Nenda hospitali mara moja."
