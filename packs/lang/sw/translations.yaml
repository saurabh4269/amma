  nb_feed_l: "Mtoto hawezi kunyonya"
  nb_feed_t: "Mtoto asiyeweza kunyonya yuko hatarini. Wasiliana na mhudumu wako wa afya mara moja."
  nb_feed_a: "Mtoto: je, mtoto hawezi kunyonya?"
