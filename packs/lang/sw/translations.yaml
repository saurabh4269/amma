  p_recall_more: "Kuna nyingine?"
  p_recall_missed: "Hizi ni dalili za hatari ambazo hukuzitaja mara hii."
  p_recall_all: "Umezikumbuka zote."
  p_check_intro: "Sasa nitauliza kuhusu kila dalili. Jibu ndiyo, hapana, au sina uhakika."
  p_open_ask: "Kuna jambo lolote unalotaka kuuliza, au jambo lolote ambalo unahisi haliko sawa?"
