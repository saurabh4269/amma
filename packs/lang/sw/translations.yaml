  q_next_vaccines_l: "Chanjo zijazo za mtoto ni lini?"
  q_next_vaccines_a: "Mpeleke mtoto kwenye kikao cha chanjo au kituo cha afya kilicho karibu akiwa na mwezi mmoja na nusu, miezi miwili na nusu, miezi mitatu na nusu, na miezi 9. Tunza kadi ya chanjo vizuri na uje nayo."
  q_spacing_l: "Nisubiri muda gani kabla ya mtoto ajaye?"
