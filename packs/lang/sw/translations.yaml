  early_pains_l: "Uchungu wa uzazi kabla ya wakati"
  early_pains_t: "Uchungu wa uzazi kabla ya wakati, kabla ya wiki 37, ni dalili ya hatari. Nenda hospitali mara moja."
  early_pains_a: "Tangu mara ya mwisho, umepata uchungu wa uzazi ingawa wakati wa kujifungua bado haujafika?"
  movement_l: "Mtoto anacheza kidogo"
  movement_t: "Mtoto kucheza kidogo kuliko awali ni dalili ya hatari. Nenda hospitali mara moja."
  movement_a: "Tangu mara ya mwisho, mtoto amekuwa akicheza kidogo kuliko awali?"
  waters_l: "Chupa ya uzazi inapasuka bila uchungu wa uzazi"
  waters_t: "Chupa ya uzazi kupasuka bila uchungu wa uzazi ni dalili ya hatari. Nenda hospitali mara moja."
  waters_a: "Tangu mara ya mwisho, chupa yako ya uzazi imepasuka, au maji yamevuja, bila uchungu wa uzazi?"
  long_labour_l: "Uchungu wa uzazi kwa zaidi ya saa 12"
  long_labour_t: "Wakati wa kujifungua ukifika: uchungu wa uzazi kwa zaidi ya saa 12 ni dalili ya hatari. Nenda hospitali mara moja."
  long_labour_a: "Je, uchungu wa uzazi umeendelea kwa zaidi ya saa 12?"
  birth_bleeding_l: "Kutoka damu nyingi wakati wa kujifungua"
  birth_bleeding_t: "Wakati wa kujifungua ukifika: kutoka damu nyingi wakati wa kujifungua au baada ya kujifungua ni dalili ya hatari. Nenda hospitali mara moja."
  birth_bleeding_a: "Je, kuna damu nyingi inayotoka wakati wa kujifungua?"
  pp_breast_l: "Matiti au chuchu zilizovimba, nyekundu au zinazouma zikiguswa"
  pp_breast_t: "Matiti yako au chuchu zimevimba, ni nyekundu au zinauma zikiguswa."
  pp_breast_a: "Mama: je, matiti yako au chuchu zimevimba, ni nyekundu au zinauma zikiguswa?"
  pp_urine_l: "Shida ya kukojoa, au mkojo kuvuja"
  pp_urine_t: "Una shida ya kukojoa, au mkojo unavuja."
  pp_urine_a: "Mama: je, una shida ya kukojoa, au mkojo unavuja?"
  pp_wound_l: "Maumivu zaidi au maambukizi mahali ulipochanika au kushonwa"
  pp_wound_t: "Kuna maumivu zaidi au maambukizi mahali ulipochanika au kushonwa."
  pp_wound_a: "Mama: je, kuna maumivu zaidi, au maambukizi, mahali ulipochanika au kushonwa?"
  pp_discharge_l: "Uchafu wenye harufu mbaya"
  pp_discharge_t: "Unatokwa na uchafu wenye harufu mbaya kwenye njia ya uzazi."
  pp_discharge_a: "Mama: je, unatokwa na uchafu wenye harufu mbaya kwenye njia ya uzazi?"
  nb_eyes_l: "Usaha unatoka kwenye macho ya mtoto"
