# Drafts, like the rest of this folder. Not yet read by a Hindi speaker or a clinician.
translations:
  t_family_planning: "अगले बच्चे में अंतर"
  t_immunisation: "शिशु के टीके"
  tfp_spacing: "दो बच्चों के बीच 3 साल का अंतर रखना माँ और शिशु दोनों के स्वास्थ्य के लिए अच्छा है।"
  tfp_fertility: "प्रसव के बाद, माहवारी लौटने से पहले भी आप दोबारा गर्भवती हो सकती हैं।"
  tfp_methods: "परिवार नियोजन कार्यक्रम में मिलने वाला अंतर रखने का कोई भी साधन आप चुन सकती हैं, जैसे आई.यू.सी.डी., इंजेक्शन, गोलियाँ या कंडोम।"
  tfp_iucd: "आई.यू.सी.डी. प्रसव के 48 घंटे के भीतर, या प्रसव के 6 हफ़्ते बाद लगवाई जा सकती है।"
  tfp_complete: "अगर आपका परिवार पूरा हो गया है, तो आप या आपके पति गर्भनिरोध का स्थायी साधन चुन सकते हैं।"
  tfp_free: "सभी सरकारी स्वास्थ्य संस्थानों में गर्भनिरोध की सभी सेवाएँ निशुल्क हैं।"
  tim_birth: "जन्म के समय शिशु को बी.सी.जी., ओ.पी.वी. और हेपेटाइटिस बी का टीका दिया जाता है। हेपेटाइटिस बी का टीका जन्म के 24 घंटे के भीतर लगना चाहिए।"
  tim_visits: "डेढ़ महीने, ढाई महीने, साढ़े तीन महीने और 9 महीने की उम्र पर शिशु को सबसे पास के टीकाकरण सत्र या स्वास्थ्य केन्द्र ले जाएँ, ताकि जो टीके लगने हैं वे सब लग जाएँ।"
  tim_m1: "डेढ़ महीने पर कार्ड में ये टीके लिखे हैं: ओ.पी.वी.-1, पेंटा-1, रोटा-1, पी.सी.वी.-1 और आई.पी.वी.-1।"
  tim_m2: "ढाई महीने पर कार्ड में ये टीके लिखे हैं: ओ.पी.वी.-2, पेंटा-2 और रोटा-2।"
  tim_m3: "साढ़े तीन महीने पर कार्ड में ये टीके लिखे हैं: ओ.पी.वी.-3, पेंटा-3, रोटा-3, पी.सी.वी.-2 और आई.पी.वी.-2।"
  tim_states: "तीन टीके केवल कुछ राज्यों और ज़िलों में मिलते हैं: जे.ई., पी.सी.वी. और रोटावायरस।"
  tim_keep: "टीकाकरण कार्ड सँभालकर रखें और अगली बार साथ लाएँ।"
  q_birth_vaccines_l: "जन्म के समय शिशु को कौन से टीके लगते हैं?"
  q_birth_vaccines_a: "जन्म के समय शिशु को बी.सी.जी., ओ.पी.वी. और हेपेटाइटिस बी का टीका दिया जाता है। हेपेटाइटिस बी का टीका जन्म के 24 घंटे के भीतर लगना चाहिए।"
  q_next_vaccines_l: "शिशु के अगले टीके कब लगेंगे?"
  q_next_vaccines_a: "डेढ़ महीने, ढाई महीने, साढ़े तीन महीने और 9 महीने की उम्र पर शिशु को सबसे पास के टीकाकरण सत्र या स्वास्थ्य केन्द्र ले जाएँ। टीकाकरण कार्ड सँभालकर रखें और साथ लाएँ।"
  q_spacing_l: "अगले बच्चे के लिए कितना रुकना चाहिए?"
  q_spacing_a: "दो बच्चों के बीच 3 साल का अंतर रखना माँ और शिशु दोनों के स्वास्थ्य के लिए अच्छा है।"
  q_fp_methods_l: "अगला गर्भ कैसे टालूँ?"
  q_fp_methods_a: "परिवार नियोजन कार्यक्रम में मिलने वाला अंतर रखने का कोई भी साधन आप चुन सकती हैं, जैसे आई.यू.सी.डी., इंजेक्शन, गोलियाँ या कंडोम। अगर परिवार पूरा हो गया है, तो आप या आपके पति स्थायी साधन चुन सकते हैं।"
  q_solid_food_l: "शिशु को ऊपर का खाना कब शुरू करूँ?"
  q_solid_food_a: "स्तनपान जारी रखें। 6 महीने पूरे होने पर शिशु को 2 से 3 बड़े चम्मच नरम, अच्छी तरह मसला हुआ खाना, दिन में 2 से 3 बार देना शुरू करें।"
  q_hand_wash_l: "हाथ कब धोने चाहिए?"
  q_hand_wash_a: "खाना बनाने से पहले, बच्चे को खिलाने से पहले, शौच के बाद और बच्चे का मल साफ़ करने के बाद दोनों हाथ साबुन से धोएँ।"
