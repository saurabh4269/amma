translations:
  q_checkups_l: "मुझे कितनी जाँचें करानी हैं?"
  q_checkups_a: "पहले तीन महीनों में स्वास्थ्य केन्द्र में पंजीकरण कराएँ। पंजीकरण के बाद कम से कम 3 प्रसव पूर्व जाँचें कराएँ। हर बार ब्लड प्रेशर, खून और पेशाब की जाँच कराएँ।"
  q_iron_l: "आयरन की गोली कैसे लेनी है?"
  q_iron_a: "पहले तीन महीनों के बाद, कम से कम 6 महीने तक रोज़ आयरन फ़ोलिक एसिड की एक गोली लें। कम से कम 180 गोलियाँ लें।"
  q_calcium_l: "कैल्शियम की गोली कैसे लेनी है?"
  q_calcium_a: "पहले तीन महीनों के बाद, कम से कम 6 महीने तक रोज़ कैल्शियम की दो गोलियाँ लें।"
  q_rest_l: "मुझे कितना आराम करना चाहिए?"
  q_rest_a: "दिन में कम से कम दो घंटे आराम करें, और रात में 8 घंटे।"
  q_weight_l: "मेरा वज़न कितना बढ़ना चाहिए?"
  q_weight_a: "हर जाँच में वज़न नपवाएँ। गर्भावस्था में कम से कम 9 से 11 किलो वज़न बढ़ना चाहिए, और आख़िरी 6 महीनों में हर महीने कम से कम 1 किलो।"
  q_cost_l: "क्या प्रसव के पैसे देने होंगे?"
  q_cost_a: "सरकारी अस्पताल में, जननी शिशु सुरक्षा कार्यक्रम के अंतर्गत, प्रसव निशुल्क है। सिजेरियन ऑपरेशन, दवाएँ, जाँचें, खून और भर्ती के दौरान भोजन भी निशुल्क है।"
  q_ride_l: "क्या अस्पताल जाने की सवारी के पैसे देने होंगे?"
  q_ride_a: "घर से स्वास्थ्य संस्थान तक, रेफ़र करने पर एक संस्थान से दूसरे तक, और वापस घर तक परिवहन निशुल्क है।"
  q_doctor_day_l: "डॉक्टर मेरी जाँच कब कर सकते हैं?"
  q_doctor_day_a: "गर्भावस्था की दूसरी या तीसरी तिमाही में, महीने की 9 तारीख को चिकित्सक द्वारा कम से कम एक प्रसव पूर्व जाँच कराएँ।"
  q_where_birth_l: "प्रसव कहाँ कराना चाहिए?"
  q_where_birth_a: "प्रसव स्वास्थ्य संस्थान में प्रशिक्षित व्यक्ति से कराना उचित है। अस्पताल पहले से तय करें और सवारी का इंतज़ाम पहले से करें। प्रसव के बाद 48 घंटे अस्पताल में रुकें।"
  q_first_feed_l: "स्तनपान कब शुरू करूँ?"
  q_first_feed_a: "जन्म के 1 घंटे के भीतर स्तनपान शुरू करें।"
  q_baby_food_l: "शिशु को क्या पिलाऊँ?"
  q_baby_food_a: "शिशु को केवल माँ का दूध ही पिलाएँ। जल्दी स्तनपान शुरू करने से माँ 6 महीने तक केवल अपना दूध पिला पाती है।"
  q_baby_bath_l: "शिशु को कब नहला सकती हूँ?"
  q_baby_bath_a: "पहले 48 घंटे तक शिशु को स्नान न कराएँ। शिशु को गर्म रखें।"
  q_cord_l: "नाल की देखभाल कैसे करूँ?"
  q_cord_a: "नाल को सूखा रखें।"
  q_small_baby_l: "मेरा शिशु बहुत छोटा है। क्या करूँ?"
  q_small_baby_a: "जन्म के समय 2.5 किलो से कम वज़न के शिशु को विशेष देखभाल चाहिए। अगर शिशु 2 किलो से कम है, तो स्तनपान जारी रखने और कंगारू मदर केयर में मदद के लिए ए.एन.एम. से संपर्क करें।"

  tc_register: "गर्भावस्था में नियमित जाँच ज़रूरी है। पहले तीन महीनों में स्वास्थ्य केन्द्र में पंजीकरण कराएँ।"
  tc_bp: "हर जाँच में ब्लड प्रेशर, खून और पेशाब की जाँच कराएँ।"
  tc_tt: "टी.टी. के दो टीके लगवाएँ: पहला गर्भ का पता चलते ही और दूसरा 1 महीने बाद।"
  tc_iron: "पहले तीन महीनों के बाद, कम से कम 6 महीने तक रोज़ आयरन फ़ोलिक एसिड की एक गोली लें। कम से कम 180 गोलियाँ लें।"
  tc_calcium: "पहले तीन महीनों के बाद, कम से कम 6 महीने तक रोज़ कैल्शियम की दो गोलियाँ लें।"
  tc_rest: "दिन में कम से कम दो घंटे आराम करें, और रात में 8 घंटे।"
  tc_salt: "केवल आयोडीन युक्त नमक इस्तेमाल करें। आंगनवाड़ी केन्द्र से मिलने वाला पूरक पोषाहार नियमित लें।"
  tc_prepare: "अस्पताल पहले से तय करें। सवारी का इंतज़ाम पहले से करें। प्रसव के बाद 48 घंटे अस्पताल में रुकें।"
  tc_family: "खतरे का कोई भी लक्षण हो, तो तुरन्त अपने परिवार वालों को बताएँ।"
  tf_warning: "गर्भावस्था में किसी भी महिला को परेशानी हो सकती है। कुछ महिलाओं में यह बिना चेतावनी के आती है। इसीलिए आप खतरे के लक्षण सीख रही हैं।"
  tf_inform: "गर्भावस्था में किसी भी सेवा या जानकारी के लिए सबसे पहले अपनी आशा से संपर्क करें।"
  tf_husband: "आपके पति को जाँच के लिए आपके साथ आना चाहिए, खतरे के लक्षण समझने चाहिए, और आपात नंबर, एम्बुलेंस का नंबर भी, पता होना चाहिए।"
  ta_tablet: "गर्भावस्था के चौथे महीने से, 180 दिन तक रोज़ आयरन फ़ोलिक एसिड की एक लाल गोली लें।"
  ta_food: "आसपास मिलने वाली आयरन से भरपूर चीज़ें खाएँ, विटामिन सी के साथ, जिससे शरीर आयरन बेहतर ले पाता है।"
  ta_after: "प्रसव के बाद भी, 180 दिन तक रोज़ आयरन फ़ोलिक एसिड की एक लाल गोली लेती रहें।"
  td_test: "शुगर की जाँच पहली जाँच के समय होती है। अगर वह सामान्य है, तो 24 से 28 हफ़्ते के बीच दोबारा होती है। आपको पानी में घुला ग्लूकोज़ पीना होता है और जाँच के लिए 2 घंटे रुकना होता है।"
  td_walk: "गर्भावस्था में शुगर होने पर रोज़ 30 मिनट टहलें या कसरत करें, और नर्स की बताई भोजन योजना पर चलें।"
  td_food: "खाना बहुत ज़्यादा कम न करें। बहुत कम खाने से बच्चे की बढ़त को नुकसान हो सकता है।"
  td_after: "प्रसव के बाद शुगर आमतौर पर सामान्य हो जाती है। ए.एन.एम. को प्रसव के 6 हफ़्ते बाद आपकी शुगर दोबारा जाँचनी चाहिए। यह जाँच ज़रूर करवाएँ।"
  te_free: "सरकारी अस्पताल में आपका प्रसव निशुल्क है। सिजेरियन ऑपरेशन, दवाएँ, जाँचें, खून और भर्ती के दौरान भोजन भी निशुल्क है।"
  te_transport: "घर से स्वास्थ्य संस्थान तक, रेफ़र करने पर एक संस्थान से दूसरे तक, और वापस घर तक परिवहन निशुल्क है।"
  te_jsy: "जननी सुरक्षा योजना में, पात्र माँ को सरकारी स्वास्थ्य संस्थान में प्रसव कराने पर नकद सहायता मिलती है। अपनी आशा से पंजीकरण कराने को कहें।"
  te_baby: "बीमार शिशु के लिए, जन्म के एक साल तक, इलाज, दवाएँ, जाँचें और परिवहन निशुल्क है।"
  tb_visits: "प्रसव के बाद माँ और शिशु की जाँच पहले दिन, तीसरे दिन, सातवें दिन और छठे हफ़्ते में होती है।"
  tb_asha: "आपकी आशा जन्म के बाद तीसरे, 7वें, 14वें, 21वें, 28वें और 42वें दिन आपके और शिशु के पास घर आती हैं।"
  tb_tablets: "प्रसव के बाद कम से कम 6 महीने तक रोज़ आयरन फ़ोलिक एसिड की एक गोली और कैल्शियम की दो गोलियाँ लें।"
  tb_pad: "संक्रमण से बचने के लिए साफ़ सैनिटरी पैड इस्तेमाल करें।"
  tb_warm: "शिशु को गर्म रखें। पहले 48 घंटे तक शिशु को स्नान न कराएँ। नाल को सूखा रखें।"
  tb_milk: "शिशु को केवल माँ का दूध ही पिलाएँ।"
  tb_sick: "शिशु को बीमार लोगों से दूर रखें।"
  tb_someone: "प्रसव के बाद कम से कम 24 घंटे तक माँ के पास हमेशा कोई रहे।"
