translations:
  p_recall_ask: "किन लक्षणों का मतलब है कि आपको तुरन्त अस्पताल जाना है? एक बताइए।"
  p_recall_more: "क्या कोई और है?"
  p_recall_missed: "ये खतरे के वे लक्षण हैं जो आपने इस बार नहीं बताए।"
  p_recall_all: "आपको सब याद थे।"
  p_check_intro: "अब मैं हर लक्षण के बारे में पूछूँगी। हाँ, नहीं, या पक्का नहीं में जवाब दें।"
  p_open_ask: "क्या आप कुछ पूछना चाहती हैं, या कुछ ठीक नहीं लग रहा?"
  p_open_more: "और कुछ?"
  p_did_you_say: "क्या आपने यह कहा:"
  p_not_sure: "इसके बारे में मुझे पक्का नहीं पता। कृपया किसी से पूछें: अपनी आशा, ए.एन.एम. या डॉक्टर से।"
  p_yes: "हाँ"
  p_no: "नहीं"
  p_unsure: "पक्का नहीं"
  p_done: "बस इतना ही"
  p_plan_intro: "पहले, आपात स्थिति के लिए आपकी योजना बनाते हैं। यह अपने परिवार के साथ मिलकर करें।"
  p_plan_playback: "यह आपकी योजना है। खतरे का कोई लक्षण हो तो इन लोगों को फ़ोन करें और इस जगह जाएँ।"
  p_clarify_summary: "मैं दोहराती हूँ। क्या यह सही है?"
  p_track_intro: "इस हफ़्ते जानने की एक बात।"

  s_decider_ask: "जब अस्पताल जाना हो, तो परिवार में आपके साथ फ़ैसला कौन करता है? नाम और फ़ोन नंबर बताइए।"
  s_decider: "मेरे साथ फ़ैसला करते हैं"
  s_escort_ask: "आपके साथ अस्पताल कौन जाएगा?"
  s_escort: "मेरे साथ जाएँगे"
  s_worker_ask: "आपकी आशा या ए.एन.एम. कौन हैं? नाम और फ़ोन नंबर बताइए।"
  s_worker: "मेरी आशा या ए.एन.एम."
  s_facility_ask: "आप किस अस्पताल जाएँगी? अभी अपने परिवार के साथ तय कर लें।"
  s_facility: "अस्पताल"
  s_transport_ask: "आप वहाँ कैसे पहुँचेंगी? गाड़ी वाले या एम्बुलेंस का नाम और नंबर बताइए।"
  s_transport: "सवारी"
  s_money_ask: "क्या परिवार ने आपात स्थिति के लिए कुछ पैसे अलग रखे हैं?"
  s_money: "अलग रखे पैसे"

