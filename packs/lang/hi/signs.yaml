translations:
  bleeding_l: "गर्भावस्था के दौरान रक्तस्राव (खून आना)"
  bleeding_t: "गर्भावस्था के दौरान खून आना खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  bleeding_a: "पिछली बार के बाद से, क्या आपको खून आया है?"
  breathless_l: "खून की गम्भीर कमी, साँस फूलने के साथ या उसके बिना"
  breathless_t: "शरीर में खून की गम्भीर कमी, साँस लेने में कठिनाई के साथ या उसके बिना, खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  breathless_a: "पिछली बार के बाद से, क्या आपकी साँस फूली है, या स्वास्थ्य कार्यकर्ता ने बताया है कि आपमें खून बहुत कम है?"
  fever_l: "तेज बुखार"
  fever_t: "गर्भावस्था में तेज बुखार खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  fever_a: "पिछली बार के बाद से, क्या आपको तेज बुखार हुआ है?"
  headache_l: "सिरदर्द और धुंधला दिखाई देना"
  headache_t: "सिरदर्द और धुंधला दिखाई देना खतरे के लक्षण हैं। तुरन्त अस्पताल जाएँ।"
  headache_a: "पिछली बार के बाद से, क्या आपको सिरदर्द हुआ है, या धुंधला दिखाई दिया है?"
  fits_l: "दौरे पड़ना"
  fits_t: "दौरे पड़ना खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  fits_a: "पिछली बार के बाद से, क्या आपको दौरा पड़ा है?"
  swelling_l: "पूरे शरीर में सूजन"
  swelling_t: "पूरे शरीर में सूजन खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  swelling_a: "पिछली बार के बाद से, क्या आपके पूरे शरीर में सूजन आई है?"
  early_pains_l: "समय से पहले प्रसव पीड़ा"
  early_pains_t: "समय से पहले, 37 हफ़्ते से पहले, प्रसव पीड़ा होना खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  early_pains_a: "पिछली बार के बाद से, क्या आपको प्रसव जैसा दर्द हुआ है, जबकि अभी प्रसव का समय नहीं हुआ?"
  movement_l: "बच्चे का कम घूमना"
  movement_t: "पेट में बच्चे का पहले से कम घूमना खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  movement_a: "पिछली बार के बाद से, क्या बच्चा पहले से कम घूम रहा है?"
  waters_l: "प्रसव पीड़ा के बिना पानी की थैली फट जाना"
  waters_t: "प्रसव पीड़ा के बिना ही पानी की थैली फट जाना खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  waters_a: "पिछली बार के बाद से, क्या प्रसव पीड़ा के बिना आपकी पानी की थैली फटी है या पानी रिसा है?"
  long_labour_l: "12 घण्टे से अधिक समय तक प्रसव पीड़ा"
  long_labour_t: "जब प्रसव का समय आए: 12 घण्टे से अधिक समय तक प्रसव पीड़ा खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  long_labour_a: "क्या प्रसव पीड़ा 12 घण्टे से अधिक समय से चल रही है?"
  birth_bleeding_l: "प्रसव के दौरान अत्यधिक रक्तस्राव"
  birth_bleeding_t: "जब प्रसव का समय आए: प्रसव के दौरान या प्रसव के बाद बहुत अधिक खून बहना खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  birth_bleeding_a: "क्या प्रसव के दौरान बहुत अधिक खून बह रहा है?"

  pp_bleeding_l: "प्रसव के पश्चात् अत्यधिक रक्तस्राव"
  pp_bleeding_t: "प्रसव के बाद बहुत अधिक खून बहना माँ के लिए खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  pp_bleeding_a: "माँ: पिछली बार के बाद से, क्या आपको बहुत अधिक खून आया है?"
  pp_fever_l: "प्रसव के एक महीने के भीतर तेज बुखार"
  pp_fever_t: "प्रसव के एक महीने के भीतर तेज बुखार माँ के लिए खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  pp_fever_a: "माँ: पिछली बार के बाद से, क्या आपको तेज बुखार हुआ है?"
  pp_fits_l: "दौरे पड़ना"
  pp_fits_t: "दौरे पड़ना माँ के लिए खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  pp_fits_a: "माँ: पिछली बार के बाद से, क्या आपको दौरा पड़ा है?"
  pp_headache_l: "तेज सिरदर्द के साथ धुंधला दिखाई देना"
  pp_headache_t: "तेज सिरदर्द के साथ धुंधला दिखाई देना माँ के लिए खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  pp_headache_a: "माँ: पिछली बार के बाद से, क्या आपको तेज सिरदर्द के साथ धुंधला दिखाई दिया है?"
  pp_breathing_l: "साँस तेज चलना या साँस लेने में कठिनाई"
  pp_breathing_t: "साँस तेज चलना या साँस लेने में कठिनाई माँ के लिए खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  pp_breathing_a: "माँ: पिछली बार के बाद से, क्या आपकी साँस तेज चली है या साँस लेने में कठिनाई हुई है?"
  pp_calf_l: "पिंडली में दर्द, लाली या सूजन, या सीने में दर्द"
  pp_calf_t: "पिंडली में दर्द, लाली या सूजन, या सीने में दर्द माँ के लिए खतरे का लक्षण है। तुरन्त अस्पताल जाएँ।"
  pp_calf_a: "माँ: पिछली बार के बाद से, क्या आपकी पिंडली में दर्द, लाली या सूजन हुई है, या सीने में दर्द हुआ है?"

  nb_feed_l: "शिशु का माँ का दूध ना पी पाना"
  nb_feed_t: "शिशु का माँ का दूध ना पी पाना खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_feed_a: "शिशु: क्या शिशु दूध नहीं पी पा रहा है?"
  nb_fits_l: "शिशु को दौरे पड़ना या ऐंठन"
  nb_fits_t: "शिशु को दौरे पड़ना या ऐंठन खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_fits_a: "शिशु: क्या शिशु को दौरा पड़ा है या ऐंठन हुई है?"
  nb_breathing_l: "शिशु की साँस तेज चलना"
  nb_breathing_t: "शिशु की साँस की गति 60 प्रति मिनट से ज्यादा होना खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_breathing_a: "शिशु: क्या शिशु की साँस तेज चल रही है?"
  nb_chest_l: "साँस लेते समय शिशु की छाती का धंसना"
  nb_chest_t: "साँस लेते समय शिशु की छाती का धंसना खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_chest_a: "शिशु: क्या हर साँस के साथ शिशु की छाती ज़ोर से अंदर धंसती है?"
  nb_hot_l: "शिशु छूने पर गरम लगना"
  nb_hot_t: "शिशु का छूने पर गरम लगना खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_hot_a: "शिशु: क्या शिशु छूने पर गरम लगता है?"
  nb_cold_l: "शिशु छूने पर ठंडा लगना"
  nb_cold_t: "शिशु का छूने पर ठंडा लगना खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_cold_a: "शिशु: क्या शिशु छूने पर ठंडा लगता है?"
  nb_movement_l: "शिशु का केवल उकसाने पर हलचल करना या बिल्कुल ना करना"
  nb_movement_t: "शिशु का केवल उकसाने पर ही हलचल करना या हलचल बिल्कुल ना करना खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_movement_a: "शिशु: क्या शिशु केवल छूने पर हिलता है, या बिल्कुल नहीं हिलता?"
  nb_yellow_l: "शिशु की हथेलियाँ और तलवे पीले होना"
  nb_yellow_t: "पहले दिन त्वचा का पीला होना, या किसी भी उम्र में हथेलियों और तलवों का पीला होना, शिशु के लिए खतरे का संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  nb_yellow_a: "शिशु: क्या शिशु की हथेलियाँ या तलवे पीले हैं, या पहले दिन त्वचा पीली थी?"

  out_preg_urgent: "आपको खतरे का एक लक्षण है। तुरन्त नज़दीकी उचित अस्पताल जाएँ। अभी अपने परिवार को बताएँ।"
  out_mother_urgent: "माँ, आपको खतरे का एक लक्षण है। तुरन्त अस्पताल जाएँ। अभी अपने परिवार को बताएँ।"
  out_newborn_urgent: "शिशु को खतरे का एक संकेत है। स्वास्थ्य कर्मचारी से तुरन्त संपर्क करें।"
  out_ask: "एक लक्षण के बारे में आप पक्का नहीं थीं। आज ही अपनी आशा या ए.एन.एम. से बात करें।"
  out_none: "आज बताए गए खतरे के लक्षणों में से कोई नहीं है। परेशानी बिना चेतावनी के भी आ सकती है, इसलिए अगर चिंता हो तो अपनी आशा या ए.एन.एम. से बात करें।"

  pp_breast_l: "स्तन या निप्पल में सूजन, लाली या दर्द"
  pp_breast_t: "आपके स्तन या निप्पल सूजे हुए, लाल या दर्द वाले हैं।"
  pp_breast_a: "माँ: क्या आपके स्तन या निप्पल सूजे हुए, लाल या दर्द वाले हैं?"
  pp_urine_l: "पेशाब करने में परेशानी, या पेशाब रिसना"
  pp_urine_t: "आपको पेशाब करने में परेशानी है, या पेशाब रिस रहा है।"
  pp_urine_a: "माँ: क्या आपको पेशाब करने में परेशानी है, या पेशाब रिस रहा है?"
  pp_wound_l: "टाँकों या फटी जगह पर दर्द बढ़ना या संक्रमण"
  pp_wound_t: "जहाँ टाँके लगे थे या फटा था, वहाँ दर्द बढ़ गया है या संक्रमण है।"
  pp_wound_a: "माँ: जहाँ टाँके लगे थे या फटा था, क्या वहाँ दर्द बढ़ा है या संक्रमण है?"
  pp_discharge_l: "बदबूदार स्राव"
  pp_discharge_t: "आपको योनि से बदबूदार स्राव हो रहा है।"
  pp_discharge_a: "माँ: क्या आपको योनि से बदबूदार स्राव हो रहा है?"
  nb_eyes_l: "शिशु की आँखों से मवाद आना"
  nb_eyes_t: "शिशु की आँखों से मवाद आ रहा है।"
  nb_eyes_a: "शिशु: क्या शिशु की आँखों से मवाद आ रहा है?"
  nb_cord_l: "शिशु की नाल में मवाद या खून"
  nb_cord_t: "शिशु की नाल में जलन है, मवाद या खून के साथ।"
  nb_cord_a: "शिशु: क्या नाल में जलन है, मवाद या खून के साथ?"
  nb_mouth_l: "शिशु के मुँह में छाले या सफ़ेद धब्बे"
  nb_mouth_t: "शिशु के मुँह में छाले या सफ़ेद धब्बे हैं।"
  nb_mouth_a: "शिशु: क्या शिशु के मुँह में छाले या सफ़ेद धब्बे हैं?"
  out_mother_soon: "माँ, जितनी जल्दी हो सके स्वास्थ्य केन्द्र जाएँ। आज ही अपनी आशा या ए.एन.एम. को बताएँ।"
  out_newborn_soon: "शिशु को जितनी जल्दी हो सके स्वास्थ्य केन्द्र ले जाएँ। आज ही अपनी आशा या ए.एन.एम. को बताएँ।"
