id: in-mch
version: 0.1.0
title: India, Mother and Child Protection card (2018) — pregnancy, birth and the six weeks after
refLang: en
license: >-
  Reference wording written for this project is CC BY 4.0. Quoted source text belongs to its publisher.
  Cards that rest on the WHO 2022 postnatal guideline are CC BY-NC-SA 3.0 IGO. Cards that rest on the
  WHO 2015 guide quote only a few words for attribution; WHO's permission has not yet been requested.

sources:
  - id: mcp2018
    title: Mother and Child Protection Card (MCP Card), 2018 Version, English
    publisher: Ministry of Health and Family Welfare and Ministry of Women and Child Development, Government of India
    year: 2018
    url: https://www.childhealthtaskforce.org/sites/default/files/2018-11/India%20MCP%20Card_English_5.28.2018.pdf
    license: Not stated in the document. Read from a mirror of the file dated 28-05-2018; the government host was unreachable.
  - id: mcp-guide
    title: Guidebook for Mother-Child Protection Card 2018 for ANM, ASHA, AWW
    publisher: Ministry of Health and Family Welfare and Ministry of Women and Child Development, Government of India
    year: 2018
    url: https://nhm.gov.in/New_Updates_2018/NHM_Components/Immunization/Guildelines_for_immunization/MCP_Guide_Book.pdf
    license: Not stated in the document.
  - id: who-pcpnc
    title: "Pregnancy, childbirth, postpartum and newborn care: a guide for essential practice, 3rd edition"
    publisher: World Health Organization
    year: 2015
    url: https://iris.who.int/handle/10665/249580
    license: All rights reserved. Permission is needed to reproduce; only short phrases are quoted here for attribution.
  - id: who-pnc22
    title: WHO recommendations on maternal and newborn care for a positive postnatal experience
    publisher: World Health Organization
    year: 2022
    url: https://iris.who.int/handle/10665/352658
    license: CC BY-NC-SA 3.0 IGO
  - id: gdm
    title: Diagnosis and Management of Gestational Diabetes Mellitus, Technical and Operational Guidelines
    publisher: Ministry of Health and Family Welfare, Government of India
    year: 2018
    url: https://nhm.gov.in/New_Updates_2018/NHM_Components/RMNCH_MH_Guidelines/Gestational-Diabetes-Mellitus.pdf
    license: May be reproduced and quoted without permission if distributed free of cost and the source is acknowledged.
  - id: amb
    title: Anemia Mukt Bharat Abhiyaan Operational Guidelines
    publisher: Nutrition Division, Ministry of Health and Family Welfare, Government of India
    year: 2026
    url: https://www.nhm.gov.in/New-Update-2025-26/Nutrition/AMB-guidelines/AMB-Abhiyaan-Guidelines.pdf
    license: Not stated in the document.

phases:
  pregnant: { teach: [pregnancy, labour], check: [pregnancy] }
  after_birth: { teach: [mother_after_birth, newborn], check: [mother_after_birth, newborn] }

flow: [plan, track, recall, check, open, outcome, carry]

schedule:
  boxIntervals: [1, 2, 4, 8]
  sessionEveryDays: 7
  afterBirthDays: [1, 3, 7, 14, 21, 28, 42]

limits: { recallTurns: 12, recallAbstains: 3, openTurns: 3, clarifierQuestions: 4, smsSigns: 3 }

templates:
  - id: carry_over
    slots: [next_visit, signs, contact]
    ref: "Next clinic visit: {next_visit}. Danger signs to watch for: {signs}. If you see one, call {contact} and go to the hospital."
  # Sent to the people in her plan when she has a danger sign.
  - id: urgent_alert
    slots: [name, signs, facility]
    ref: "Danger sign for {name}: {signs}. We need to go to {facility} now. Please call and come."
